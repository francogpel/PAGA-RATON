<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pagá Ratón</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* ── Tokens de diseño ─────────────────────────────────────────────────── */
:root{
  --bg:#080B12;
  --surface:#121822;
  --surface-2:#0C111A;
  --elevated:#1A2331;
  --border:#222C3C;
  --border-hi:#313F55;
  --text:#F2F5FA;
  --muted:#8D97A8;
  --dim:#5B6678;
  --accent:#FFA23A;
  --accent-2:#FF6B00;
  --green:#4ADE80;
  --red:#F87171;
  --mp:#009EE3;
  --r-sm:10px;--r-md:14px;--r-lg:18px;--r-xl:24px;
  --shadow:0 12px 32px rgba(0,0,0,.45);
  --glow:0 8px 22px rgba(255,107,0,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);
  background-image:
    radial-gradient(900px 520px at 50% -12%,rgba(255,162,58,.08),transparent 70%),
    radial-gradient(700px 420px at 115% 105%,rgba(0,158,227,.07),transparent 70%);
  background-attachment:fixed;
  color:var(--text);min-height:100vh;display:flex;justify-content:center;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
#app{width:100%;max-width:420px;padding:0 20px calc(72px + env(safe-area-inset-bottom));display:flex;flex-direction:column;animation:rise .38s cubic-bezier(.22,1,.36,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

/* ── Tipografía ───────────────────────────────────────────────────────── */
.h1{font-size:26px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px}
.label{color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;display:block;margin-bottom:9px}
.muted{color:var(--dim);font-size:12px}
.sub{color:var(--muted);font-size:13.5px;line-height:1.5}
.accent{color:var(--accent)}
.green{color:var(--green)}
.mp-color{color:var(--mp)}

/* ── Formularios ──────────────────────────────────────────────────────── */
input,button{font-family:inherit}
input{background:rgba(255,255,255,.035);border:1.5px solid var(--border);border-radius:var(--r-md);color:var(--text);font-size:16px;padding:15px 14px;outline:none;width:100%;transition:border-color .2s,box-shadow .2s,background .2s}
input:focus{border-color:var(--accent);background:rgba(255,255,255,.055);box-shadow:0 0 0 3px rgba(255,162,58,.15)}
input::placeholder{color:var(--dim)}

/* ── Botones ──────────────────────────────────────────────────────────── */
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#1A1206;border:none;border-radius:var(--r-md);padding:16px;font-weight:700;font-size:15px;letter-spacing:.2px;cursor:pointer;width:100%;box-shadow:var(--glow);transition:transform .15s,box-shadow .2s,filter .2s}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 28px rgba(255,107,0,.3)}
.btn-primary:active:not(:disabled){transform:translateY(0)}
.btn-primary:disabled{background:var(--elevated);color:var(--dim);box-shadow:none;cursor:default}
.btn-ghost{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--r-md);padding:15px;color:var(--text);font-size:14.5px;font-weight:500;cursor:pointer;width:100%;transition:background .2s,border-color .2s}
.btn-ghost:hover{background:rgba(255,255,255,.07);border-color:var(--border-hi)}
.btn-google{background:#fff;color:#111;border:none;border-radius:var(--r-md);padding:15px;font-weight:600;font-size:14.5px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s,box-shadow .2s}
.btn-google:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.35)}
.btn-mp{background:linear-gradient(135deg,#00A9F0,#0080C4);color:#fff;border:none;border-radius:var(--r-md);padding:15px 18px;font-weight:700;font-size:14px;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;box-shadow:0 8px 20px rgba(0,158,227,.2);transition:transform .15s}
.btn-mp:hover:not(:disabled){transform:translateY(-1px)}
.btn-mp:disabled{opacity:.5;cursor:default;box-shadow:none}
.btn-small{font-size:11px;padding:6px 11px;border-radius:9px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--muted);cursor:pointer;transition:.2s}
.btn-small:hover{border-color:var(--border-hi);color:var(--text)}
.btn-back{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;color:var(--muted);font-size:12px;font-weight:500;padding:8px 13px;cursor:pointer;transition:.2s}
.btn-back:hover{border-color:var(--border-hi);color:var(--text)}
.add-btn{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#1A1206;border:none;border-radius:var(--r-md);padding:0 20px;font-weight:800;font-size:20px;cursor:pointer;flex-shrink:0;transition:.2s}
.add-btn:disabled{background:var(--elevated);color:var(--dim);cursor:default}

/* ── Login / registro ─────────────────────────────────────────────────── */
.logo-img{display:block;margin:0 auto 16px;width:92px;height:92px;border-radius:26px;object-fit:cover;box-shadow:0 14px 34px rgba(0,0,0,.5),0 0 0 1px rgba(255,162,58,.18)}
.auth-card{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--border);border-radius:var(--r-xl);padding:22px;box-shadow:var(--shadow)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:4px;gap:4px}
.seg button{flex:1;background:none;border:none;border-radius:10px;padding:11px 8px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:.22s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--elevated);color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.4)}
.switch-line{text-align:center;color:var(--dim);font-size:12.5px;margin-top:16px}
.switch-line button{background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;padding:0;text-decoration:underline}
.divider{display:flex;align-items:center;gap:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.divider span{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.8px}
.err{color:var(--red);font-size:13px;text-align:center;min-height:18px}
.spinner{width:26px;height:26px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}

/* ── Superficies ──────────────────────────────────────────────────────── */
.card{background:var(--surface);border-radius:var(--r-md);border:1px solid var(--border);padding:14px 16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dashed{border:1.5px dashed var(--border);border-radius:var(--r-md);padding:24px;text-align:center}
.gap8{display:flex;flex-direction:column;gap:8px}
.gap10{display:flex;flex-direction:column;gap:10px}
.gap18{display:flex;flex-direction:column;gap:18px}
.summary{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border-radius:var(--r-lg);padding:16px;border:1px solid var(--border);display:flex;justify-content:space-between}
.big-btn{border-radius:var(--r-lg);padding:20px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;width:100%;text-align:left;border:none;transition:transform .15s,box-shadow .2s,border-color .2s}
.big-btn:hover:not(:disabled){transform:translateY(-2px)}
.room-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;width:100%;text-align:left;cursor:pointer;transition:transform .15s,border-color .2s,background .2s}
.room-card:hover{transform:translateY(-2px);border-color:var(--border-hi);background:var(--elevated)}
.join-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;width:100%;transition:transform .15s,border-color .2s,background .2s}
.join-btn:hover{transform:translateY(-1px);border-color:var(--border-hi);background:var(--elevated)}

/* ── Indicadores ──────────────────────────────────────────────────────── */
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;transition:background .4s,box-shadow .4s}
.dot.paid{background:var(--green);box-shadow:0 0 10px rgba(74,222,128,.7)}
.dot.unpaid{background:var(--red)}
.badge{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:.2px}
.badge.paid{color:var(--green);background:rgba(74,222,128,.14)}
.badge.me{color:var(--accent);background:rgba(255,162,58,.14)}
.badge.open{color:var(--accent);background:rgba(255,162,58,.14)}
.badge.closed{color:var(--green);background:rgba(74,222,128,.14)}
.progress-bar{height:5px;background:var(--border);border-radius:99px;overflow:hidden;margin:11px 0}
.progress-fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.22,1,.36,1)}

/* ── Mercado Pago / estados ───────────────────────────────────────────── */
.mp-connected{background:linear-gradient(180deg,rgba(0,158,227,.12),rgba(0,158,227,.04));border:1px solid rgba(0,158,227,.3);border-radius:var(--r-md);padding:14px 16px}
.pay-box{background:linear-gradient(180deg,rgba(0,158,227,.14),rgba(0,158,227,.04));border-radius:var(--r-lg);padding:18px;border:1px solid rgba(0,158,227,.28)}
.paid-box{background:linear-gradient(180deg,rgba(74,222,128,.14),rgba(74,222,128,.04));border-radius:var(--r-lg);padding:16px;border:1px solid rgba(74,222,128,.3);display:flex;align-items:center;gap:12px}
.all-paid{background:linear-gradient(180deg,rgba(74,222,128,.14),rgba(74,222,128,.04));border-radius:var(--r-md);padding:15px;text-align:center;border:1px solid rgba(74,222,128,.3)}
.link-box{background:var(--surface-2);border-radius:var(--r-sm);padding:11px 12px;border:1px solid var(--border);overflow:hidden;flex:1}
.link-text{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.copy-btn{background:rgba(255,162,58,.14);color:var(--accent);border:none;border-radius:9px;padding:9px 13px;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;transition:.2s}
.copy-btn:hover{background:rgba(255,162,58,.22)}
.copy-btn.done{background:rgba(74,222,128,.16);color:var(--green)}

/* ── Modal / navegación ───────────────────────────────────────────────── */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:200;padding:24px}
#modal.show{display:flex;animation:rise .25s ease}
.modal-box{background:var(--surface);border-radius:var(--r-xl);padding:28px 24px;width:100%;max-width:330px;border:1px solid var(--border);text-align:center;box-shadow:var(--shadow)}
.user-pill{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--r-md);padding:8px 12px;margin-top:18px;margin-bottom:16px}
.user-pill .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:10.5px;color:#1A1206;font-weight:800;flex-shrink:0}
.menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--elevated);border:1px solid var(--border-hi);border-radius:var(--r-md);padding:6px;min-width:196px;z-index:151;box-shadow:0 12px 32px rgba(0,0,0,.6);animation:rise .18s ease}
.menu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;border-radius:9px;padding:11px 12px;font-size:14px;cursor:pointer;text-align:left;transition:background .15s}
.menu button:hover{background:rgba(255,255,255,.06)}
.hamb{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:9px;width:34px;height:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;flex-shrink:0;transition:.2s}
.hamb:hover{border-color:var(--border-hi)}
.hamb span{width:14px;height:2px;background:var(--muted);border-radius:1px}
/* ── Hero de la portada + marca ───────────────────────────────────────── */
.hero{position:relative;margin:0 -20px 22px;aspect-ratio:1/1;max-height:58vh;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 35%;display:block}
.hero-fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,11,18,.22) 0%,rgba(8,11,18,0) 14%,rgba(8,11,18,0) 74%,rgba(8,11,18,.86) 93%,var(--bg) 100%)}
.hero-pill{position:absolute;top:16px;right:16px;display:flex;align-items:center;gap:8px;background:rgba(8,11,18,.7);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:8px 14px;font-size:12.5px;font-weight:600;color:#E6EBF4}
.hero-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green);flex-shrink:0}

/* ── Campos con ícono ─────────────────────────────────────────────────── */
.label-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.label-row .label{margin-bottom:0}
.link-accent{background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;padding:0}
.link-accent:hover{text-decoration:underline}
.field{position:relative;display:flex;align-items:center}
.field-icon{position:absolute;left:14px;color:var(--dim);display:flex;pointer-events:none}
.field input{padding-left:42px}
.field.has-eye input{padding-right:46px}
.field .eye{position:absolute;right:8px;background:none;border:none;color:var(--dim);cursor:pointer;padding:8px;display:flex;border-radius:8px;transition:color .2s}
.field .eye:hover{color:var(--text)}
.btn-cta{display:flex;align-items:center;justify-content:center;gap:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:800}

/* ── Bienvenida con burbujas (solo escritorio) ────────────────────────── */
.welcome{display:none}
.welcome-title{font-size:36px;font-weight:900;letter-spacing:-1px;line-height:1.1;margin:0 0 20px}
.welcome-title span{background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.bubbles{display:flex;flex-direction:column;gap:12px}
.bubble{display:flex;align-items:center;gap:15px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--border);border-radius:22px;border-top-left-radius:7px;padding:15px 20px;box-shadow:0 10px 26px rgba(0,0,0,.3);transition:transform .28s cubic-bezier(.22,1,.36,1),border-color .28s,background .28s}
.bubble:hover{transform:translateX(8px);border-color:var(--border-hi);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03))}
.bubble p{margin:0;font-size:15px;font-weight:500;color:var(--text);line-height:1.45}
.bubble .emo{font-size:24px;flex-shrink:0;line-height:1;filter:drop-shadow(0 3px 8px rgba(0,0,0,.45));animation:bob 3.4s ease-in-out infinite;animation-delay:calc(var(--i) * .45s)}

/* ── Animaciones ──────────────────────────────────────────────────────── */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes heroZoom{from{opacity:0;transform:scale(1.07)}to{opacity:1;transform:scale(1)}}
@keyframes slideIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes slideRight{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,.55)}70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}}
.hero-dot{animation:pulseDot 2.2s ease-out infinite}

/* ── Escritorio: 60% portada + bienvenida · 40% ingreso ───────────────── */
@media (min-width:1000px){
  /* Pantalla partida a sangre: 60% portada, 40% ingreso */
  #app[data-screen="login"]{max-width:none;padding:0}
  .login-split{display:grid;grid-template-columns:60% 40%;min-height:100vh}
  .login-art{display:flex;flex-direction:column;justify-content:center;gap:28px;padding:44px clamp(32px,4vw,64px);min-width:0;background:radial-gradient(900px 520px at 32% 0%,rgba(255,162,58,.07),transparent 66%)}
  /* Cuadrada y centrada: la portada se ve entera, sin recorte */
  .login-art .hero{margin:0 auto;align-self:center;height:min(52vh,540px);width:auto;aspect-ratio:1/1;max-width:100%;max-height:none;border-radius:var(--r-xl);border:1px solid var(--border);box-shadow:0 26px 64px rgba(0,0,0,.55);animation:heroZoom 1.1s cubic-bezier(.22,1,.36,1) both}
  .login-art .hero img{object-position:50% 50%}
  .login-art .hero-fade{background:linear-gradient(180deg,rgba(8,11,18,.22) 0%,rgba(8,11,18,0) 32%,rgba(8,11,18,.42) 100%)}
  .welcome{display:block;width:min(100%,560px);margin:0 auto;animation:slideIn .7s .2s cubic-bezier(.22,1,.36,1) both}
  .bubble{animation:slideRight .65s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(.35s + var(--i) * .13s)}
  .login-form{display:flex;flex-direction:column;justify-content:center;padding:44px clamp(28px,3vw,52px);border-left:1px solid var(--border);background:rgba(255,255,255,.012);animation:slideIn .7s .1s cubic-bezier(.22,1,.36,1) both}
  .login-form .auth-card{width:100%;max-width:420px;margin:0 auto}
  .login-form .dev-credit{width:100%;max-width:420px;margin:26px auto 0}
}
@media (min-width:1000px) and (max-width:1240px){
  .welcome-title{font-size:29px;margin-bottom:16px}
  .bubble{padding:13px 16px}
  .bubble p{font-size:14px}
}

/* Respeta a quien pidió menos movimiento en su sistema */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ── Crédito de desarrollo (Infinity Solutions) ───────────────────────── */
.dev-credit{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:28px;padding-top:20px;border-top:1px solid var(--border);text-align:center}
.dev-credit p{font-size:12px;color:var(--dim);margin:0}
.dev-credit p a{color:var(--text);font-weight:600;text-decoration:underline;text-underline-offset:2px;transition:color .2s}
.dev-credit p a:hover{color:var(--accent)}
.dev-logo{display:inline-flex;transition:opacity .2s}
.dev-logo:hover{opacity:.75}
.dev-logo img{height:34px;width:auto;max-width:170px;object-fit:contain}
.dev-privacy{color:var(--dim);font-size:11px;text-decoration:underline;margin-top:2px}
svg{overflow:visible}
</style>
</head>
<body>

<div id="modal">
  <div class="modal-box">
    <div style="font-size:32px;margin-bottom:12px">💵</div>
    <h3 style="font-size:18px;font-weight:700;margin-bottom:8px;color:#F2F5FA">Pago en efectivo</h3>
    <p style="color:#8D97A8;font-size:14px;line-height:1.5;margin-bottom:24px">
      ¿Confirmás que <strong style="color:#F2F5FA" id="modal-name"></strong> pagó su parte en efectivo?
    </p>
    <div style="display:flex;gap:10px">
      <button onclick="closeModal()" class="btn-ghost" style="flex:1;padding:14px">No</button>
      <button onclick="confirmMarkPaid()" class="btn-primary" style="flex:1;padding:14px">Sí, confirmar</button>
    </div>
  </div>
</div>

<div id="app">
  <div style="display:flex;flex-direction:column;gap:14px;justify-content:center;align-items:center;height:100vh">
    <div class="spinner"></div>
    <p class="muted">Cargando…</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script>
const LOGO = "./paga-raton-logo.jpeg";
const S = {
  screen:"loading", user:null, rooms:[], room:null, myId:null, shareUrl:"",
  loadingId:null, animTotal:0, polling:null, pendingMarkId:null, mpStatus:null,
  authReady:false, menuOpen:false, names:[], mpConnecting:false,
  authTab:"login", authEmail:"",
};

const urlParams   = new URLSearchParams(location.search);
const roomParam   = urlParams.get("room");
const mpConnected = urlParams.get("mp_connected");

async function initFirebase(){
  try{
    const cfg = await fetch("/api/config").then(r=>r.json());
    if(!cfg.apiKey){ S.authReady=true; startApp(); return; }
    firebase.initializeApp(cfg);
    firebase.auth().onAuthStateChanged(async user=>{
      S.user = user;
      if(user) await loadAdminData();
      if(!S.authReady){ S.authReady=true; startApp(); } else render();
    });
  }catch{ S.authReady=true; startApp(); }
}
function startApp(){
  if(roomParam){ S.screen="join"; }
  else if(!S.user && firebase.apps?.length){ S.screen="login"; }

async function authFetch(url,opts={}){

}

function polar(cx,cy,r,deg){const a=(deg-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function slicePath(cx,cy,r,ri,s,e){
  const g=1.5;s+=g;e-=g;
  const[x1,y1]=polar(cx,cy,r,s),[x2,y2]=polar(cx,cy,r,e);
  const[ix1,iy1]=polar(cx,cy,ri,s),[ix2,iy2]=polar(cx,cy,ri,e);
  const la=e-s>180?1:0;
  return`M${ix1} ${iy1}L${x1} ${y1}A${r} ${r} 0 ${la} 1 ${x2} ${y2}L${ix2} ${iy2}A${ri} ${ri} 0 ${la} 0 ${ix1} ${iy1}Z`;
}
function buildWheel(participants,myId,isAdmin){
  const cx=155,cy=155,r=132,ri=52,n=participants.length,step=360/n;
  let svg=`<svg width="310" height="310" viewBox="0 0 310 310"><defs><filter id="gp"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
  participants.forEach((p,i)=>{
    const sa=i*step,ea=sa+step,ma=sa+step/2;
    const[lx,ly]=polar(cx,cy,(r+ri)/2,ma);
    const isMe=p.id===myId,busy=S.loadingId===p.id;
    const fill=p.paid?"#4ADE80":busy?"#5B6678":"#F87171";
    const canTap=(isMe||isAdmin)&&!p.paid&&!S.loadingId;
    const short=p.name.length>7?p.name.slice(0,6)+"…":p.name;
    svg+=`<g ${canTap?`onclick="doPay('${p.id}','${isAdmin}')"`:""} style="cursor:${canTap?"pointer":"default"}">`;
    if(isMe&&!p.paid)svg+=`<path d="${slicePath(cx,cy,r+7,ri-5,sa,ea)}" fill="#FFA23A" opacity="0.2"/>`;
    svg+=`<path d="${slicePath(cx,cy,r,ri,sa,ea)}" fill="${fill}" ${p.paid?'filter="url(#gp)"':""} opacity="${p.paid?1:.84}" style="transition:fill .5s"/>`;
    if(step>28)svg+=`<text x="${lx}" y="${ly-(step>50?7:0)}" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="${step>60?12:step>40?11:9}" font-weight="600" style="pointer-events:none">${short}</text>`;
    if(step>50)svg+=`<text x="${lx}" y="${ly+8}" text-anchor="middle" dominant-baseline="central" fill="rgba(255,255,255,.6)" font-size="9" style="pointer-events:none">${p.paid?"✓":busy?"…":isMe?"tocame":"—"}</text>`;
    svg+=`</g>`;
  });
  svg+=`<circle cx="${cx}" cy="${cy}" r="${ri-1}" fill="#0C111A"/><circle cx="${cx}" cy="${cy}" r="${ri-1}" fill="none" stroke="#222C3C" stroke-width="1"/></svg>`;
  return svg;
}
function mpLogo(sz,onBlue){return `<img src="${onBlue?'./mp-logo-badge.png':'./mp-logo.png'}" alt="MP" style="height:${sz}px;width:auto;display:block;flex-shrink:0"/>`;}

  if(!S.names.length){el.innerHTML=`<p class="muted">Agregá al menos 2 participantes</p>`;el.className="dashed";return;}
  el.className="gap8";
  el.innerHTML=S.names.map((n,i)=>`<div class="card row"><div class="row" style="gap:10px"><span class="muted">${i+1}</span><span>${n}</span></div><button onclick="removeName('${n.replace(/'/g,"\\'")}')" style="background:none;border:none;color:#5B6678;cursor:pointer;font-size:18px;padding:0 4px">×</button></div>`).join("");
}
async function createRoom(){
  const title=document.getElementById("inp-title")?.value.trim();
  const total=parseInt(document.getElementById("inp-total")?.value,10);
  if(!title||!total||S.names.length<2)return;
  const b=document.getElementById("btn-create");b.disabled=true;b.textContent="Creando sala…";
  try{
    const res=await authFetch("/api/rooms",{method:"POST",body:JSON.stringify({title,total,participants:S.names})});
    if(res.status===401){alert("Sesión expirada. Volvé a ingresar.");S.screen="login";render();return;}
    const data=await res.json();
    S.room=data;S.shareUrl=data.shareUrl||`${location.origin}/?room=${data.id}`;
    S.rooms=[data,...S.rooms];S.names=[];
    S.screen="created";render();
  }catch{alert("Error al crear la sala.");b.disabled=false;updateSetupBtn();}
}

function renderMisSalas(){
  const openRooms=S.rooms.filter(r=>r.participants.some(p=>!p.paid));
  const closedRooms=S.rooms.filter(r=>r.participants.every(p=>p.paid));
  function card(r){
    const paidCount=r.participants.filter(p=>p.paid).length,total=r.participants.length,allPaid=paidCount===total;
    const pct=Math.round((paidCount/total)*100),amount=Math.round(r.total/total);
    const date=new Date(r.createdAt).toLocaleDateString("es-AR",{day:"numeric",month:"short"});
    return `<button class="room-card" onclick="openRoom('${r.id}')" style="border-color:${allPaid?'#14331F':'#222C3C'}">
      <div class="row" style="margin-bottom:10px"><p style="font-size:15px;font-weight:700;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#F2F5FA">${r.title}</p><span class="badge ${allPaid?"closed":"open"}">${allPaid?"✅ Cerrada":"🟡 Abierta"}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${allPaid?"#4ADE80":"#FFA23A"}"></div></div>
      <div class="row"><span class="sub" style="font-size:12px"><span style="color:${allPaid?"#4ADE80":"#F2F5FA"};font-weight:600">${paidCount}</span>/${total} pagaron · $${amount.toLocaleString("es-AR")} c/u</span><span class="muted" style="font-size:11px">${date}</span></div>
    </button>`;
  }
  return `
    ${userPillHTML(true)}
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
      <button onclick="S.screen='home';render()" class="btn-back" style="flex-shrink:0">← Volver</button>
      <div><h1 style="font-size:22px;font-weight:700;margin:0">Mis salas</h1><p class="sub" style="margin:0">${S.rooms.length} sala${S.rooms.length!==1?"s":""} creada${S.rooms.length!==1?"s":""}</p></div>
    </div>
    ${!S.rooms.length?`<div class="dashed" style="padding:40px 24px"><div style="font-size:36px;margin-bottom:12px">📋</div><p style="color:#8D97A8;font-size:15px;font-weight:500;margin:0 0 6px">Todavía no creaste ninguna sala</p><p class="muted" style="margin:0">Volvé al inicio para crear tu primera sala</p></div>`:``}
    ${openRooms.length?`<div class="row" style="justify-content:flex-start;gap:8px;margin-bottom:12px"><div style="width:8px;height:8px;border-radius:50%;background:#FFA23A"></div><p class="label" style="margin:0">Salas abiertas (${openRooms.length})</p></div><div class="gap8" style="margin-bottom:20px">${openRooms.map(card).join("")}</div>`:``}
    ${closedRooms.length?`<div class="row" style="justify-content:flex-start;gap:8px;margin-bottom:12px"><div style="width:8px;height:8px;border-radius:50%;background:#4ADE80"></div><p class="label" style="margin:0">Salas cerradas (${closedRooms.length})</p></div><div class="gap8">${closedRooms.map(card).join("")}</div>`:``}`;
}
function openRoom(id){const r=S.rooms.find(x=>x.id===id);if(r){S.room=r;S.shareUrl=`${location.origin}/?room=${r.id}`;S.screen="adminRoom";startPolling();render();}}

function renderCreated(){
  const r=S.room,amount=Math.round(r.total/r.participants.length);
  return `
    ${userPillHTML(false)}
    <div style="text-align:center;margin-bottom:22px"><div style="font-size:44px;margin-bottom:10px">🎉</div><h2 style="font-size:22px;font-weight:700;margin-bottom:6px">${r.title}</h2><p class="sub">$${r.total.toLocaleString("es-AR")} · ${r.participants.length} personas · <span class="accent">$${amount.toLocaleString("es-AR")} c/u</span></p></div>
    <div class="card" style="margin-bottom:12px">
      <p class="label" style="margin-bottom:10px">Link para compartir</p>
      <div class="row" style="margin-bottom:8px"><div class="link-box"><p class="link-text">${S.shareUrl}</p></div><button class="copy-btn" id="btn-copy" onclick="copyLink()">Copiar</button></div>
      <p class="muted">Cada participante entra al link, elige su nombre y paga directo a tu Mercado Pago</p>
    </div>
    ${r.mpAlias?`<div style="background:#0A1C2B;border:1px solid rgba(0,158,227,.25);border-radius:14px;padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;gap:10px">${mpLogo(20)}<div><p class="mp-color" style="font-size:11px;font-weight:700;margin:0 0 2px;text-transform:uppercase;letter-spacing:.5px">Mercado Pago conectado</p><p class="sub" style="font-size:13px;margin:0">${r.mpAlias}</p></div></div>`:""}
    <div class="gap10">
      <button class="btn-primary" onclick="S.screen='adminRoom';startPolling();render()">Ver sala →</button>
      <button onclick="S.screen='setup';render()" style="background:none;border:none;color:#5B6678;font-size:13px;padding:8px;cursor:pointer">+ Crear otra sala</button>
    </div>`;
}
function copyLink(){navigator.clipboard.writeText(S.shareUrl).catch(()=>{});const b=document.getElementById("btn-copy");if(b){b.textContent="✓ Copiado";b.className="copy-btn done";setTimeout(()=>{b.textContent="Copiar";b.className="copy-btn";},2000);}}

async function renderJoin(app){
  if(!S.room&&roomParam){
    app.innerHTML=`<div style="display:flex;justify-content:center;align-items:center;height:80vh"><p class="sub">Cargando sala…</p></div>`;
    try{const res=await fetch(`/api/rooms/${roomParam}`);if(!res.ok)throw new Error();S.room=await res.json();S.shareUrl=`${location.origin}/?room=${roomParam}`;}
    catch{app.innerHTML=`<div style="display:flex;justify-content:center;align-items:center;height:80vh"><p style="color:#F87171">Sala no encontrada o link inválido.</p></div>`;return;}
  }
  const r=S.room,amount=Math.round(r.total/r.participants.length);
  app.innerHTML=`
    <div style="padding-top:16px;display:flex;justify-content:flex-end;margin-bottom:8px">
      <button onclick="goToLogin()" style="background:#121822;border:1px solid #222C3C;border-radius:10px;color:#FFA23A;font-size:12px;font-weight:600;padding:8px 14px;cursor:pointer">Iniciar sesión / Registrarse</button>
    </div>
    <div style="text-align:center;margin-bottom:24px">
      <img src="${LOGO}" style="display:block;margin:0 auto 14px;width:88px;height:88px;border-radius:20px;object-fit:cover;box-shadow:0 6px 20px rgba(0,0,0,.4)"/>
      <h1 style="font-size:19px;font-weight:800;margin:0 0 10px;line-height:1.3">Fuiste invitado a una sala de<br/>PAGÁ RATÓN</h1>
      <p class="label" style="margin-bottom:3px">${r.title}</p>
      <p class="sub">$${amount.toLocaleString("es-AR")} por persona · ${r.participants.length} personas</p>
    </div>
    <p style="color:#8D97A8;font-size:14px;font-weight:500;margin-bottom:14px">¿Cuál es tu nombre?</p>
    <div class="gap8">
      ${r.participants.map(p=>`<button class="join-btn" onclick="joinAs('${p.id}')"><div class="row" style="gap:12px"><div class="dot ${p.paid?"paid":"unpaid"}"></div><span style="font-size:15px;font-weight:500;color:#F2F5FA">${p.name}</span>${p.paid?`<span class="badge paid">Ya pagó</span>`:""}</div><span style="color:#5B6678">→</span></button>`).join("")}
      <button onclick="joinAs(null)" style="background:none;border:none;color:#5B6678;font-size:13px;padding:10px;cursor:pointer;margin-top:4px">Solo quiero ver el estado →</button>
    </div>`;
}
function joinAs(id){S.myId=id;S.screen="room";startPolling();render();}
// El invitado puede optar por crear su propia cuenta. Lo mandamos al login
// quitando el ?room= de la URL, para que entre al flujo normal de admin.
// (Pagar como invitado NUNCA requiere cuenta — esto es totalmente opcional.)
function goToLogin(){ location.href = location.origin + "/"; }

function renderRoom(isAdmin){
  const r=S.room,amount=Math.round(r.total/r.participants.length);
  const paidCount=r.participants.filter(p=>p.paid).length,allPaid=paidCount===r.participants.length;
  const me=r.participants.find(p=>p.id===S.myId);
  const today=new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});
  let h="";
  if(isAdmin)h+=userPillHTML(true);
  else h+=`<div style="padding-top:44px;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><p class="sub" style="font-size:11px;margin:0;text-transform:capitalize">${today}</p><button onclick="leaveRoom()" class="btn-back">← Salir</button></div>`;
  h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:${isAdmin?10:6}px;flex-wrap:wrap"><h1 style="font-size:21px;font-weight:700;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${r.title}</h1>${isAdmin?`<span class="badge me">Admin</span><span class="badge ${allPaid?"closed":"open"}">${allPaid?"✅ Cerrada":"🟡 Abierta"}</span>`:""}</div>`;
  if(isAdmin){
    h+=`<div class="card row" style="gap:8px;margin-bottom:10px"><div class="link-box"><p class="link-text">${S.shareUrl}</p></div><button class="copy-btn" id="btn-copy" onclick="copyLink()">Copiar link</button></div>`;
    h+=`<div style="background:#101820;border:1px solid rgba(0,158,227,.2);border-radius:14px;padding:14px 16px;margin-bottom:10px"><div class="row" style="margin-bottom:8px"><span class="label" style="margin:0">💳 Cuenta Mercado Pago</span></div><p style="font-size:15px;font-weight:700;color:#F2F5FA;margin:0">${r.mpAlias||"Sin alias configurado"}</p></div>`;
  }
  h+=`<div style="display:flex;justify-content:center;position:relative;margin-top:4px">${buildWheel(r.participants,S.myId,isAdmin)}<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none"><p style="color:#8D97A8;font-size:9px;margin:0;letter-spacing:1px;text-transform:uppercase">cobrado</p><p style="font-size:15px;font-weight:700;margin:1px 0 0" id="anim-total">$${S.animTotal.toLocaleString("es-AR")}</p><p style="color:${allPaid?"#4ADE80":"#8D97A8"};font-size:10px;margin:1px 0 0">${paidCount}/${r.participants.length}</p></div></div>`;
  if(!isAdmin&&me&&!me.paid)h+=`<div class="pay-box" style="margin-top:14px"><p class="mp-color" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:0 0 10px">Tu parte — ${me.name}</p><div class="row"><p style="font-size:24px;font-weight:700;margin:0">$${amount.toLocaleString("es-AR")}</p><button onclick="doPay('${me.id}','false')" id="btn-pay" ${S.loadingId?"disabled":""} style="background:${S.loadingId===me.id?"#121822":"#009EE3"};color:${S.loadingId===me.id?"#5B6678":"#fff"};border:none;border-radius:12px;padding:13px 16px;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px">${mpLogo(18,true)}${S.loadingId===me.id?"Abriendo…":"Pagar ahora"}</button></div></div>`;
  if(!isAdmin&&me?.paid)h+=`<div class="paid-box" style="margin-top:14px"><span style="font-size:22px">✅</span><div><p class="green" style="font-size:13px;font-weight:600;margin:0">¡Ya pagaste tu parte!</p><p class="sub" style="font-size:11px;margin-top:2px">Gracias, ${me.name} · $${amount.toLocaleString("es-AR")}</p></div></div>`;
  if(!isAdmin&&!me)h+=`<div class="card" style="margin-top:14px;text-align:center"><p class="sub" style="font-size:13px">Estás viendo el estado de la sala</p></div>`;
  if(allPaid)h+=`<div class="all-paid" style="margin-top:12px"><p class="green" style="font-size:15px;font-weight:600">🎉 ¡Todos pagaron! La sala está cerrada.</p></div>`;
  h+=`<div class="summary" style="margin-top:14px"><div><p class="sub" style="font-size:11px;margin:0">Total</p><p style="font-size:18px;font-weight:700;margin:2px 0 0">$${r.total.toLocaleString("es-AR")}</p></div><div style="text-align:right"><p class="sub" style="font-size:11px;margin:0">Por persona</p><p class="accent" style="font-size:18px;font-weight:700;margin:2px 0 0">$${amount.toLocaleString("es-AR")}</p></div></div>`;
  h+=`<div style="margin-top:16px"><p class="label" style="margin-bottom:10px">Participantes</p><div class="gap8">${r.participants.map(p=>{
    const isMe=p.id===S.myId,busy=S.loadingId===p.id;
    return `<div class="card row" style="border-color:${p.paid?"#14331F":isMe&&!isAdmin?"rgba(255,162,58,.25)":"#222C3C"};background:${isMe&&!isAdmin?"#1A2331":"#121822"}"><div class="row" style="gap:10px"><div class="dot ${p.paid?"paid":"unpaid"}"></div><span style="font-size:14px;font-weight:${isMe?600:400}">${p.name}</span>${isMe&&!isAdmin?`<span class="badge me">(vos)</span>`:""}${p.paid?`<span class="badge paid">Pagado</span>`:""}</div><div class="row" style="gap:8px"><span class="sub" style="font-size:13px">$${amount.toLocaleString("es-AR")}</span>${isAdmin&&!p.paid?`<button class="btn-small" onclick="askMarkPaid('${p.id}','${p.name.replace(/'/g,"\\'")}')">${busy?"…":"💵 Efectivo"}</button>`:""}</div></div>`;
  }).join("")}</div></div>`;
  return h;
}
function leaveRoom(){stopPolling();S.myId=null;S.loadingId=null;S.animTotal=0;if(roomParam)location.href="/";else S.screen="home";render();}

function askMarkPaid(id,name){S.pendingMarkId=id;document.getElementById("modal-name").textContent=name;document.getElementById("modal").classList.add("show");}
function closeModal(){document.getElementById("modal").classList.remove("show");S.pendingMarkId=null;}
async function confirmMarkPaid(){
  const id=S.pendingMarkId;closeModal();if(!id)return;
  S.loadingId=id;render();
  try{const res=await authFetch(`/api/rooms/${S.room.id}/mark-paid/${id}`,{method:"POST"});if(res.ok){S.room=await res.json();S.rooms=S.rooms.map(r=>r.id===S.room.id?S.room:r);}}
  catch{alert("Error al marcar como pagado.");}
  S.loadingId=null;render();
}
async function doPay(participantId,isAdminStr){
  if(S.loadingId)return;
  if(isAdminStr==="true"){const p=S.room.participants.find(x=>x.id===participantId);askMarkPaid(participantId,p?.name||"");return;}
  S.loadingId=participantId;render();
  try{const res=await fetch(`/api/rooms/${S.room.id}/pay/${participantId}`,{method:"POST",headers:{"Content-Type":"application/json"}});const data=await res.json();if(data.init_point)window.open(data.init_point,"_blank");else alert(data.error||"No se pudo generar el link de pago.");}
  catch{alert("Error al generar el link de pago.");}
  S.loadingId=null;render();
}
function startPolling(){
  stopPolling();
  S.polling=setInterval(async()=>{
    if(!S.room)return;
    try{const res=await fetch(`/api/rooms/${S.room.id}`);if(!res.ok)return;const updated=await res.json();
      const prev=JSON.stringify(S.room.participants.map(p=>p.paid)),next=JSON.stringify(updated.participants.map(p=>p.paid));
      if(prev!==next){S.room=updated;S.rooms=S.rooms.map(r=>r.id===updated.id?updated:r);render();}}catch{}
  },3000);
}
function stopPolling(){if(S.polling){clearInterval(S.polling);S.polling=null;}}

let animFrame;
function animateTotal(from,to){
  if(animFrame)cancelAnimationFrame(animFrame);
  if(from===to){S.animTotal=to;return;}
  const t0=performance.now(),dur=600;
  function tick(now){const p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,3);S.animTotal=Math.round(from+(to-from)*e);const el=document.getElementById("anim-total");if(el)el.textContent="$"+S.animTotal.toLocaleString("es-AR");if(p<1)animFrame=requestAnimationFrame(tick);else S.animTotal=to;}
  animFrame=requestAnimationFrame(tick);
}

document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
document.getElementById("modal").addEventListener("click",e=>{if(e.target===e.currentTarget)closeModal();});
document.addEventListener("click",e=>{if(S.menuOpen&&!e.target.closest(".hamb")&&!e.target.closest(".menu")){S.menuOpen=false;render();}});

initFirebase();
</script>
</body>
</html>
