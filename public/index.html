<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pagá Ratón</title>
<meta name="description" content="Dividí la cancha, el asado o lo que pinte, y cobrá directo en tu Mercado Pago."/>
<meta name="theme-color" content="#0B0B0F"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="Pagá Ratón"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet"/>
<style>
/* ── Tokens de diseño ─────────────────────────────────────────────────── */
:root{
  --bg:#0B0B0F;
  --surface:#16161C;
  --surface-2:#131319;
  --elevated:#1A1A22;
  --border:#22222A;
  --border-hi:#33333D;
  --text:#F5F3EE;
  --muted:#9E9EA8;
  --dim:#60606C;
  --accent:#FFB547;
  --accent-2:#FF6B18;
  --green:#4ADE80;
  --red:#F87171;
  --mp:#009EE3;
  --celeste:#75AADB;
  --success:#00C982;
  --danger:#E53E3E;
  --font-display:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --r-sm:10px;--r-md:14px;--r-lg:18px;--r-xl:24px;
  --shadow:0 12px 32px rgba(0,0,0,.45);
  --glow:0 8px 22px rgba(255,107,24,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);
  background-image:
    radial-gradient(900px 520px at 50% -12%,rgba(255,181,71,.08),transparent 70%),
    radial-gradient(700px 420px at 115% 105%,rgba(0,158,227,.07),transparent 70%);
  background-attachment:fixed;
  color:var(--text);min-height:100vh;display:flex;justify-content:center;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
#app{width:100%;max-width:420px;padding:0 20px calc(72px + env(safe-area-inset-bottom));display:flex;flex-direction:column;animation:rise .38s cubic-bezier(.22,1,.36,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

/* ── Tipografía ───────────────────────────────────────────────────────── */
.h1{font-size:26px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px}
.label{color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;display:block;margin-bottom:9px}
.muted{color:var(--dim);font-size:12px}
.sub{color:var(--muted);font-size:13.5px;line-height:1.5}
.accent{color:var(--accent)}
.green{color:var(--green)}

/* ── Formularios ──────────────────────────────────────────────────────── */
input,button{font-family:inherit}
input{background:rgba(255,255,255,.035);border:1.5px solid var(--border);border-radius:var(--r-md);color:var(--text);font-size:16px;padding:15px 14px;outline:none;width:100%;transition:border-color .2s,box-shadow .2s,background .2s}
input:focus{border-color:var(--accent);background:rgba(255,255,255,.055);box-shadow:0 0 0 3px rgba(255,181,71,.15)}
input::placeholder{color:var(--dim)}

/* ── Botones ──────────────────────────────────────────────────────────── */
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#1A1206;border:none;border-radius:var(--r-md);padding:16px;font-weight:700;font-size:15px;letter-spacing:.2px;cursor:pointer;width:100%;box-shadow:var(--glow);transition:transform .15s,box-shadow .2s,filter .2s}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 28px rgba(255,107,24,.3)}
.btn-primary:active:not(:disabled){transform:translateY(0)}
.btn-primary:disabled{background:var(--elevated);color:var(--dim);box-shadow:none;cursor:default}
.btn-ghost{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--r-md);padding:15px;color:var(--text);font-size:14.5px;font-weight:500;cursor:pointer;width:100%;transition:background .2s,border-color .2s}
.btn-ghost:hover{background:rgba(255,255,255,.07);border-color:var(--border-hi)}
.btn-google{background:#fff;color:#111;border:none;border-radius:var(--r-md);padding:15px;font-weight:600;font-size:14.5px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s,box-shadow .2s}
.btn-google:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.35)}

/* ── Login / registro ─────────────────────────────────────────────────── */
.logo-img{display:block;margin:0 auto 16px;width:92px;height:92px;border-radius:26px;object-fit:cover;box-shadow:0 14px 34px rgba(0,0,0,.5),0 0 0 1px rgba(255,181,71,.18)}
.auth-card{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--border);border-radius:var(--r-xl);padding:22px;box-shadow:var(--shadow)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:4px;gap:4px}
.seg button{flex:1;background:none;border:none;border-radius:10px;padding:11px 8px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:.22s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--elevated);color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.4)}
.switch-line{text-align:center;color:var(--dim);font-size:12.5px;margin-top:16px}
.switch-line button{background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;padding:0;text-decoration:underline}
.divider{display:flex;align-items:center;gap:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.divider span{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.8px}
.err{color:var(--red);font-size:13px;text-align:center;min-height:18px}
.spinner{width:26px;height:26px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}

/* ── Superficies ──────────────────────────────────────────────────────── */
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gap10{display:flex;flex-direction:column;gap:10px}

/* ── Indicadores ──────────────────────────────────────────────────────── */
.progress-bar{height:5px;background:var(--border);border-radius:99px;overflow:hidden;margin:11px 0}
.progress-fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.22,1,.36,1)}

/* ── Mercado Pago / estados ───────────────────────────────────────────── */

/* ── Modal / navegación ───────────────────────────────────────────────── */
#modal,#confirm-modal,#email-modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:200;padding:24px}
#modal.show,#confirm-modal.show,#email-modal.show{display:flex;animation:rise .25s ease}
.email-box{max-width:400px;text-align:left;padding:0;overflow:hidden}
.email-box .legal-head{padding:18px 20px 14px}
.email-body{padding:18px 20px 22px}
.email-body .switch-line{margin-top:16px}
.btn-google:disabled,.btn-mail:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}
.btn-mail{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:clamp(10px,1.7dvh,16px)}
.btn-primary.btn-danger{background:linear-gradient(135deg,#F87171,#E53E3E);color:#fff;box-shadow:0 8px 22px rgba(229,62,62,.28)}
.btn-primary.btn-danger:hover:not(:disabled){box-shadow:0 12px 28px rgba(229,62,62,.36)}
.modal-box{background:var(--surface);border-radius:var(--r-xl);padding:28px 24px;width:100%;max-width:330px;border:1px solid var(--border);text-align:center;box-shadow:var(--shadow)}
/* ── Hero de la portada + marca ───────────────────────────────────────── */
.hero{position:relative;margin:0 -20px 22px;aspect-ratio:1/1;max-height:58vh;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 35%;display:block}
.hero-fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,15,.22) 0%,rgba(11,11,15,0) 14%,rgba(11,11,15,0) 62%,rgba(11,11,15,.55) 82%,rgba(11,11,15,.92) 94%,var(--bg) 100%)}
.hero-pill{position:absolute;top:16px;right:16px;display:flex;align-items:center;gap:8px;background:rgba(11,11,15,.7);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:8px 14px;font-size:12.5px;font-weight:600;color:#E6EBF4}
.hero-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green);flex-shrink:0}

/* ── Campos con ícono ─────────────────────────────────────────────────── */
.label-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.label-row .label{margin-bottom:0}
.link-accent{background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;padding:0}
.link-accent:hover{text-decoration:underline}
.field{position:relative;display:flex;align-items:center}
.field-icon{position:absolute;left:14px;color:var(--dim);display:flex;pointer-events:none}
.field input{padding-left:42px}
.field.has-eye input{padding-right:46px}
.field .eye{position:absolute;right:8px;background:none;border:none;color:var(--dim);cursor:pointer;padding:8px;display:flex;border-radius:8px;transition:color .2s}
.field .eye:hover{color:var(--text)}
.btn-cta{display:flex;align-items:center;justify-content:center;gap:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:800}

/* ── Bienvenida con burbujas (solo escritorio) ────────────────────────── */
.welcome{display:none}
.welcome-title{font-size:36px;font-weight:900;letter-spacing:-1px;line-height:1.1;margin:0 0 20px}
.welcome-title span{background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.bubbles{display:flex;flex-direction:column;gap:12px}
.bubble{display:flex;align-items:center;gap:15px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--border);border-radius:22px;border-top-left-radius:7px;padding:15px 20px;box-shadow:0 10px 26px rgba(0,0,0,.3);transition:transform .28s cubic-bezier(.22,1,.36,1),border-color .28s,background .28s}
.bubble:hover{transform:translateX(8px);border-color:var(--border-hi);background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03))}
.bubble p{margin:0;font-size:15px;font-weight:500;color:var(--text);line-height:1.45}
.bubble .emo{font-size:24px;flex-shrink:0;line-height:1;filter:drop-shadow(0 3px 8px rgba(0,0,0,.45));animation:bob 3.4s ease-in-out infinite;animation-delay:calc(var(--i) * .45s)}

/* ── Animaciones ──────────────────────────────────────────────────────── */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes heroZoom{from{opacity:0;transform:scale(1.07)}to{opacity:1;transform:scale(1)}}
@keyframes slideIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes slideRight{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,.55)}70%{box-shadow:0 0 0 7px rgba(74,222,128,0)}}
.hero-dot{animation:pulseDot 2.2s ease-out infinite}

/* ── Escritorio: 60% portada + bienvenida · 40% ingreso ───────────────── */
@media (min-width:1000px){
  /* Pantalla partida a sangre: 60% portada, 40% ingreso */
  #app[data-screen="login"]{max-width:none;padding:0}
  .login-split{display:grid;grid-template-columns:60% 40%;height:100%}

  /* Columna izquierda: la portada ocupa el alto libre, las tarjetas abajo */
  .login-art{display:block;padding:0;min-width:0;overflow:hidden}
  .login-art .hero{width:100%;height:100%;max-height:none;min-height:0;margin:0;aspect-ratio:auto;border-radius:0;animation:heroZoom 1.1s cubic-bezier(.22,1,.36,1) both}
  .login-art .hero img{object-position:50% 45%}

  /* Columna derecha: bienvenida + formulario, sin tarjeta contenedora */
  .login-form{display:flex;flex-direction:column;justify-content:center;overflow-y:auto;padding:5vh clamp(28px,3.4vw,56px);border-left:1px solid var(--border);animation:slideIn .7s .1s cubic-bezier(.22,1,.36,1) both}
  .login-form .welcome{display:block;width:100%;max-width:430px;margin:0 auto clamp(10px,2.2vh,26px)}
  .login-form .auth-card{width:100%;max-width:430px;margin:0 auto;background:none;border:none;border-radius:0;padding:0;box-shadow:none}
  .login-form .dev-credit{width:100%;max-width:430px;margin:clamp(10px,2.2vh,30px) auto 0;padding-top:clamp(8px,1.6vh,20px);gap:clamp(4px,1vh,10px)}
  .login-form .dev-logo img{height:clamp(18px,2.7vh,34px)}

  /* Todo escala con el alto de la ventana para que nunca aparezca scroll */
  .login-form .welcome-title{font-size:clamp(23px,3.5vh,40px);margin-bottom:clamp(4px,1vh,10px)}
  .login-form .welcome-sub{font-size:clamp(12.5px,1.7vh,15px)}
  .login-form input{padding:clamp(10px,1.6vh,15px) 14px}
  .login-form .field input{padding-left:42px}
  .login-form .btn-primary{padding:clamp(11px,1.9vh,16px)}
  .login-form .gap10{gap:clamp(5px,1.1vh,10px)}
  .login-form .label{margin-bottom:clamp(4px,.9vh,9px)}
  .login-form .switch-line{margin-top:clamp(8px,1.5vh,16px)}
  .login-form .remember{font-size:clamp(12px,1.4vh,13px)}

  /* Retoques del mockup, solo en escritorio */
  .login-form .seg{border-radius:12px;margin-bottom:clamp(8px,1.8vh,16px)}
  .login-form .seg button{text-transform:uppercase;letter-spacing:.06em;font-size:12px;font-weight:700;padding:clamp(8px,1.4vh,11px) 8px}
  .login-form .seg button.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#0B0B0F;box-shadow:0 6px 16px rgba(255,107,24,.3)}
  .login-form .btn-google{background:rgba(255,255,255,.045);color:var(--text);border:1px solid var(--border);padding:clamp(10px,1.7vh,15px)}
  .login-form .btn-google:hover{background:rgba(255,255,255,.08);transform:none;box-shadow:none}
  .login-form .divider{margin:clamp(7px,1.8vh,18px) 0}
}
@media (min-width:1000px) and (max-height:620px){
  /* Ventanas muy bajas: se va la bajada, el título alcanza para presentar */
  .login-form .welcome-sub{display:none}
  .login-form .dev-logo img{height:16px}
  .login-form .dev-credit p{font-size:11px}
}
@media (min-width:1000px) and (max-width:1280px){
  .login-form{padding:5vh 28px}
}

/* Respeta a quien pidió menos movimiento en su sistema */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ── Modal legal ──────────────────────────────────────────────────────── */
#legal-modal{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:300;padding:20px}
#legal-modal.show{display:flex;animation:rise .25s ease}
.legal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}
.legal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 22px 15px;border-bottom:1px solid var(--border);flex-shrink:0}
.legal-head h3{font-size:17px;font-weight:700;margin:0;color:var(--text)}
.legal-close{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:9px;color:var(--muted);width:32px;height:32px;font-size:19px;line-height:1;cursor:pointer;flex-shrink:0;transition:.2s}
.legal-close:hover{color:var(--text);border-color:var(--border-hi)}
.legal-body{overflow-y:auto;padding:20px 22px;font-size:13.5px;line-height:1.62;color:var(--muted);-webkit-overflow-scrolling:touch}
.legal-body h4{color:var(--text);font-size:14px;font-weight:700;margin:22px 0 8px}
.legal-body p{margin:0 0 10px}
.legal-body ul{margin:0 0 12px;padding-left:18px}
.legal-body li{margin-bottom:7px}
.legal-body strong{color:var(--text);font-weight:600}
.legal-alert{background:linear-gradient(180deg,rgba(255,181,71,.11),rgba(255,181,71,.03));border:1px solid rgba(255,181,71,.3);border-radius:var(--r-md);padding:15px 17px;margin-bottom:20px;color:var(--muted);font-size:13px}
.legal-date{font-size:11.5px;color:var(--dim);margin-top:20px}
.legal-foot{padding:16px 22px 20px;border-top:1px solid var(--border);flex-shrink:0}
.legal-foot .btn-primary{padding:13px}

/* ── Login: siempre una sola pantalla, sin scroll ─────────────────────── */
#app[data-screen="login"]{height:100vh;height:100dvh;max-height:100dvh;padding:0;overflow:hidden}
@media (max-width:999px){
  .login-split{height:100%;display:flex;flex-direction:column}
  .login-art{flex:1 1 auto;min-height:0;display:flex}
  .hero{flex:1 1 auto;width:100%;min-height:120px;max-height:100vw;height:auto;margin:0;aspect-ratio:auto;border-radius:0}
  .login-form{flex:0 0 auto}
  .login-form{overflow-y:auto;display:flex;flex-direction:column;justify-content:center;padding:0 20px clamp(8px,1.6dvh,20px)}
  .auth-card{padding:clamp(12px,2dvh,20px)}
  .seg{margin-bottom:clamp(10px,1.9dvh,20px)}
  .btn-google{padding:clamp(10px,1.7dvh,15px)}
  .divider{margin:clamp(10px,1.9dvh,20px) 0}
  input{padding:clamp(10px,1.6dvh,15px) 14px}
  .gap10{gap:clamp(6px,1.1dvh,10px)}
  .btn-primary{padding:clamp(11px,2dvh,16px)}
  .label{margin-bottom:clamp(4px,.9dvh,9px)}
  .switch-line{margin-top:clamp(8px,1.5dvh,16px)}
  .remember{font-size:12.5px}
  .dev-credit{margin-top:clamp(10px,1.9dvh,28px);padding-top:clamp(8px,1.5dvh,20px);gap:clamp(4px,.9dvh,10px)}
  .dev-logo img{height:clamp(18px,3dvh,34px)}
}
@media (max-width:999px) and (max-height:700px){
  /* Celulares bajos: se recorta el respiro para que igual entre todo */
  .auth-card{padding:10px}
  .seg button{padding:9px 8px}
  .btn-google{padding:10px}
  .divider{margin:8px 0}
  .switch-line{margin-top:7px;font-size:12px}
  .gap10{gap:5px}
  .dev-credit{margin-top:5px;padding-top:5px;gap:3px}
  .dev-credit p{font-size:11px}
  .dev-logo img{height:20px}
  .dev-privacy{font-size:10.5px}
}
@media (max-width:999px) and (max-height:655px){
  /* Celulares muy bajos: la pestaña ya ofrece crear cuenta, el link sobra */
  .switch-line{display:none}
  .dev-logo img{height:16px}
}
.err:empty{min-height:0;margin:0}

/* ── Bienvenida (solo escritorio) ─────────────────────────────────────── */
.welcome{display:none}
.welcome-title{font-family:var(--font-display);font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:0 0 10px;color:var(--text)}
.welcome-sub{font-size:15px;line-height:1.55;color:var(--muted);margin:0}

/* ── Recordar sesión ──────────────────────────────────────────────────── */
.remember{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;padding:2px 0}
.remember input{position:absolute;opacity:0;width:0;height:0}
.remember-box{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--border-hi);background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:transparent;flex-shrink:0;transition:.2s}
.remember:hover .remember-box{border-color:var(--accent)}
.remember input:checked + .remember-box{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#0B0B0F}
.remember input:focus-visible + .remember-box{box-shadow:0 0 0 3px rgba(255,181,71,.25)}

/* ── Panel admin ──────────────────────────────────────────────────────── */

/* ── Crédito de desarrollo (Infinity Solutions) ───────────────────────── */
.dev-credit{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:28px;padding-top:20px;border-top:1px solid var(--border);text-align:center}
.dev-credit p{font-size:12px;color:var(--dim);margin:0}
.dev-credit p a{color:var(--text);font-weight:600;text-decoration:underline;text-underline-offset:2px;transition:color .2s}
.dev-credit p a:hover{color:var(--accent)}
.dev-logo{display:inline-flex;transition:opacity .2s}
.dev-logo:hover{opacity:.75}
.dev-logo img{height:34px;width:auto;max-width:170px;object-fit:contain}
.dev-privacy{color:var(--dim);font-size:11px;text-decoration:underline;margin-top:2px}
svg{overflow:visible}
/* ══════════════════════════════════════════════════════════════════════════
   UI DE LA APP — todas las pantallas menos el login (prefijo u-)
   ══════════════════════════════════════════════════════════════════════════ */
#app:not([data-screen="login"]){max-width:560px}
#app[data-screen="admin"]{max-width:1080px}

.u-top{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;margin:0 -20px 6px;padding:14px 20px;background:linear-gradient(180deg,rgba(11,11,15,.94) 0%,rgba(11,11,15,.8) 70%,rgba(11,11,15,0) 100%);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.u-brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.u-brand img{width:34px;height:34px;border-radius:10px;object-fit:cover;box-shadow:0 0 0 1px rgba(255,181,71,.28)}
.u-brand span{font-family:var(--font-display);font-weight:800;font-size:16px;letter-spacing:-.2px}
.u-top-title{flex:1;min-width:0;margin:0;font-family:var(--font-display);font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:.2s}
.u-icon-btn:hover{background:rgba(255,255,255,.08);border-color:var(--border-hi)}
.u-avatar{width:40px;height:40px;border-radius:50%;border:none;padding:0;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#1A1206;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 3px rgba(255,181,71,.16);transition:box-shadow .2s}
.u-avatar:hover{box-shadow:0 0 0 4px rgba(255,181,71,.3)}
.u-avatar img,.u-av img{width:100%;height:100%;object-fit:cover}
.u-menu-wrap{position:relative;flex-shrink:0}
.u-menu{position:absolute;right:0;top:calc(100% + 10px);min-width:236px;background:rgba(26,26,34,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border-hi);border-radius:16px;padding:8px;box-shadow:0 22px 54px rgba(0,0,0,.6);animation:rise .18s ease;z-index:70}
.u-menu-head{padding:10px 12px 12px;border-bottom:1px solid var(--border);margin-bottom:6px}
.u-menu-head p{margin:0}
.u-menu button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;border-radius:10px;padding:11px 12px;color:var(--text);font-size:14px;font-family:inherit;cursor:pointer;text-align:left;transition:background .15s}
.u-menu button:hover{background:rgba(255,255,255,.06)}
.u-menu button.danger{color:var(--red)}
.u-menu hr{border:none;height:1px;background:var(--border);margin:6px 4px}

.u-h1{font-family:var(--font-display);font-size:28px;font-weight:800;letter-spacing:-.6px;line-height:1.15;margin:0}
.u-h2{font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:-.2px;margin:0}
.u-kicker{font-size:10.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin:0}
.u-big{font-family:var(--font-display);font-size:38px;font-weight:800;letter-spacing:-1px;margin:10px 0 2px}
.u-section{margin-top:28px}
.u-section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.u-link{background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;padding:0;font-family:inherit}
.u-link:hover{text-decoration:underline}

.u-card{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border:1px solid var(--border);border-radius:22px;padding:18px;position:relative}
.u-card + .u-card{margin-top:12px}
.u-glow{box-shadow:0 22px 54px rgba(0,0,0,.35)}

.u-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.u-stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.u-stat{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--border);border-radius:16px;padding:13px 14px;min-width:0}
.u-stat p{margin:0}
.u-card .u-stat{padding:11px 10px;border-radius:14px}
.u-card .u-stat .v{font-size:clamp(14px,4.1vw,19px)}
.u-stat .u-kicker{letter-spacing:.7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-stat .v{font-family:var(--font-display);font-size:clamp(15px,4.6vw,21px);font-weight:800;letter-spacing:-.4px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.u-cta{display:flex;align-items:center;gap:16px;width:100%;padding:20px;border:none;border-radius:22px;cursor:pointer;text-align:left;font-family:inherit;color:#1A1206;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 18px 40px rgba(255,107,24,.28);position:relative;overflow:hidden;transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s}
.u-cta:hover{transform:translateY(-2px);box-shadow:0 24px 50px rgba(255,107,24,.36)}
.u-cta::after{content:"";position:absolute;right:-34px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.17);pointer-events:none}
.u-cta .ico{width:48px;height:48px;border-radius:14px;background:rgba(0,0,0,.13);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:1}
.u-cta .t{font-family:var(--font-display);font-size:18px;font-weight:800;margin:0}
.u-cta .s{font-size:13px;opacity:.72;margin:2px 0 0}

.u-tile{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:18px;border:1px solid var(--border);background:rgba(255,255,255,.03);cursor:pointer;text-align:left;color:var(--text);font-family:inherit;transition:.2s}
.u-tile:hover{background:rgba(255,255,255,.06);border-color:var(--border-hi);transform:translateY(-1px)}
.u-tile .ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.u-tile p{margin:0}
.u-banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,rgba(0,158,227,.16),rgba(0,158,227,.05));border:1px solid rgba(0,158,227,.32)}

.u-room{display:flex;align-items:center;gap:14px;padding:14px 14px 14px 16px;border-radius:18px;border:1px solid var(--border);background:rgba(255,255,255,.03);cursor:pointer;transition:.2s}
.u-room:hover{background:rgba(255,255,255,.06);border-color:var(--border-hi);transform:translateY(-1px)}
.u-room + .u-room{margin-top:10px}
.u-ring{--p:0;--c:var(--accent);width:48px;height:48px;border-radius:50%;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--c) calc(var(--p) * 1%),rgba(255,255,255,.08) 0)}
.u-ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:#18181F}
.u-ring span{position:relative;font-size:11.5px;font-weight:800}
.u-room-main{flex:1;min-width:0}
.u-room-main p{margin:0}
.u-room-title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-room-side{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:6px}

.u-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.u-chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.u-chip.plain::before{display:none}
.u-chip.open{color:var(--accent);background:rgba(255,181,71,.12);border:1px solid rgba(255,181,71,.28)}
.u-chip.closed{color:var(--green);background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.28)}
.u-chip.info{color:var(--celeste);background:rgba(117,170,219,.12);border:1px solid rgba(117,170,219,.28)}

.u-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px 18px;font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);font-family:inherit;transition:.2s;white-space:nowrap}
.u-btn:hover:not(:disabled){background:rgba(255,255,255,.09);border-color:var(--border-hi)}
.u-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:#1A1206;box-shadow:var(--glow)}
.u-btn.primary:hover:not(:disabled){transform:translateY(-1px);background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.u-btn.mp{background:linear-gradient(135deg,#00A9F0,#0080C4);border:none;color:#fff;box-shadow:0 10px 24px rgba(0,158,227,.25)}
.u-btn.mp:hover:not(:disabled){background:linear-gradient(135deg,#00B4FF,#0088D1)}
.u-btn.u-wa{background:rgba(37,211,102,.12);border-color:rgba(37,211,102,.35);color:#4BE08A}
.u-btn.u-wa:hover:not(:disabled){background:rgba(37,211,102,.2);border-color:rgba(37,211,102,.5)}
.u-btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.u-btn.ghost:hover:not(:disabled){background:rgba(255,255,255,.04);color:var(--text)}
.u-btn.block{width:100%}
.u-btn.sm{padding:8px 12px;font-size:12.5px;border-radius:10px}
.u-btn:disabled{opacity:.45;cursor:default;box-shadow:none;transform:none}
.u-btn.done{color:var(--green);border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.1)}
.u-del{width:30px;height:30px;border-radius:10px;border:1px solid var(--border);background:none;color:var(--dim);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;flex-shrink:0;padding:0}
.u-del:hover{color:var(--red);border-color:rgba(229,62,62,.45);background:rgba(229,62,62,.1)}

.u-empty{text-align:center;padding:36px 24px;border:1.5px dashed var(--border);border-radius:22px}
.u-empty img{width:80px;height:80px;border-radius:22px;object-fit:cover;margin:0 auto 14px;display:block}
.u-seg{display:flex;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px}
.u-seg button{flex:1;padding:9px 6px;border:none;border-radius:10px;background:none;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s;white-space:nowrap}
.u-seg button.on{background:var(--elevated);color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.4)}

.u-step{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.u-step-n{width:24px;height:24px;border-radius:50%;background:rgba(255,181,71,.14);color:var(--accent);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.u-step-n.ok{background:rgba(74,222,128,.15);color:var(--green)}
.u-quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.u-quick button{padding:8px 12px;border-radius:99px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text);font-size:13px;cursor:pointer;font-family:inherit;transition:.2s}
.u-quick button:hover{border-color:rgba(255,181,71,.5);background:rgba(255,181,71,.08)}
.u-money{display:flex;align-items:center;gap:6px;border:1.5px solid var(--border);border-radius:16px;padding:4px 16px;background:rgba(255,255,255,.03);transition:.2s}
.u-money:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,181,71,.15)}
.u-money span{font-family:var(--font-display);font-size:28px;font-weight:800;color:var(--muted)}
.u-money input,.u-money input:focus{border:none;background:none;box-shadow:none;font-family:var(--font-display);font-size:30px;font-weight:800;padding:8px 0;letter-spacing:-.5px}
.u-add{display:flex;gap:8px}
.u-add input{flex:1}
.u-add button{width:54px;flex-shrink:0;border-radius:14px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#1A1206;font-size:24px;font-weight:800;cursor:pointer;transition:.2s}
.u-add button:disabled{background:var(--elevated);color:var(--dim);cursor:default}
.u-people{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.u-person{display:inline-flex;align-items:center;gap:8px;padding:5px 5px 5px 5px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--border);font-size:13.5px;animation:rise .2s ease}
.u-person .a{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:#1A1206;flex-shrink:0}
.u-person button{width:24px;height:24px;border-radius:50%;border:none;background:rgba(255,255,255,.07);color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0}
.u-person button:hover{background:rgba(229,62,62,.2);color:var(--red)}
.u-sticky{position:sticky;bottom:14px;margin-top:20px;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 18px;border-radius:20px;background:rgba(26,26,34,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border-hi);box-shadow:0 18px 40px rgba(0,0,0,.5)}
.u-sticky .info{flex:1;min-width:0}
.u-sticky .info p{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.u-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#1A1206;flex-shrink:0;overflow:hidden}
.u-wheel{display:flex;justify-content:center;position:relative;padding:6px 0}
.u-wheel svg{width:100%;max-width:290px;height:auto;display:block}
.u-wheel-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.u-wheel-center p{margin:0}
.u-wheel-total{font-family:var(--font-display);font-size:20px;font-weight:800;margin-top:2px!important;letter-spacing:-.4px}
.u-share{display:flex;gap:8px;align-items:center}
.u-share .link{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-mp-line{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.u-pay{background:linear-gradient(135deg,rgba(0,158,227,.2),rgba(0,158,227,.06));border:1px solid rgba(0,158,227,.35);border-radius:22px;padding:18px}
.u-pay-amount{margin:0;font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-.5px}
.u-paid{background:linear-gradient(135deg,rgba(74,222,128,.17),rgba(74,222,128,.05));border:1px solid rgba(74,222,128,.35);border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px}
.u-person-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--border);background:rgba(255,255,255,.025)}
.u-person-row + .u-person-row{margin-top:8px}
.u-person-row.me{border-color:rgba(255,181,71,.38);background:rgba(255,181,71,.05)}
.u-person-row.paid{border-color:rgba(74,222,128,.22)}

.u-invite{text-align:center;padding:26px 20px 22px;border-radius:26px;background:radial-gradient(420px 220px at 50% 0%,rgba(255,181,71,.14),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--border)}
.u-invite img{width:96px;height:96px;border-radius:26px;object-fit:cover;display:block;margin:0 auto 16px;box-shadow:0 14px 34px rgba(0,0,0,.5),0 0 0 1px rgba(255,181,71,.22)}
.u-pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.u-pick button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;border-radius:18px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text);cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;transition:.2s;min-width:0}
.u-pick button:hover{border-color:rgba(255,181,71,.5);background:rgba(255,181,71,.06);transform:translateY(-2px)}
.u-pick .u-av{width:46px;height:46px;font-size:15px}
.u-pick .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.u-success{width:84px;height:84px;border-radius:50%;margin:8px auto 18px;background:linear-gradient(135deg,#5BE38E,#00C982);display:flex;align-items:center;justify-content:center;color:#05301A;box-shadow:0 0 0 10px rgba(74,222,128,.1),0 18px 40px rgba(0,201,130,.3);animation:pop .5s cubic-bezier(.22,1.4,.36,1) both}
.u-success.sm{width:44px;height:44px;margin:0;flex-shrink:0;box-shadow:none;animation:none}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

.u-table{border:1px solid var(--border);border-radius:20px;overflow:hidden;background:rgba(255,255,255,.02)}
.u-tr{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,.9fr) minmax(0,1.1fr) minmax(0,1.4fr) minmax(0,.5fr) minmax(0,1.2fr);gap:12px;align-items:center;padding:14px 18px;border-top:1px solid var(--border)}
.u-tr.head{border-top:none;background:rgba(255,255,255,.03);font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding-top:12px;padding-bottom:12px}
.u-tr p{margin:0}
.u-tr .lbl{display:none}

.u-install{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 10px 12px 12px;border-radius:18px;background:linear-gradient(135deg,rgba(255,181,71,.14),rgba(255,107,24,.05));border:1px solid rgba(255,181,71,.3);animation:rise .3s ease}
.u-install img{width:44px;height:44px;border-radius:12px;flex-shrink:0;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.u-x{width:28px;height:28px;border-radius:50%;border:none;background:rgba(255,255,255,.06);color:var(--muted);font-size:16px;line-height:1;cursor:pointer;flex-shrink:0;padding:0}
.u-x:hover{background:rgba(255,255,255,.12);color:var(--text)}

/* Botón "Descargar la app" del login */
.dl-app{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;max-width:430px;margin:12px auto 0;padding:11px 16px;border-radius:14px;border:1px dashed rgba(255,181,71,.45);background:rgba(255,181,71,.07);color:var(--accent);font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.dl-app:hover{background:rgba(255,181,71,.14);border-style:solid;transform:translateY(-1px)}
.dl-app .dl-plat{font-weight:500;font-size:11.5px;color:var(--dim)}
@media (max-width:999px){
  .dl-app{margin-top:clamp(8px,1.4dvh,12px);padding:clamp(8px,1.2dvh,11px) 14px}
}
@media (max-width:999px) and (max-height:700px){
  .dl-app .dl-plat{display:none}
}
@media (min-width:1000px){
  .login-form .dl-app{margin-top:clamp(10px,1.8vh,16px);padding:clamp(9px,1.3vh,12px) 16px}
}

/* Modales de la app (efectivo y confirmaciones) */
#modal .modal-box,#confirm-modal .modal-box{border-radius:26px;padding:30px 24px 22px;background:linear-gradient(180deg,#1C1C25,#15151B);border:1px solid var(--border-hi);box-shadow:0 30px 70px rgba(0,0,0,.6)}
#modal .modal-box > div:first-child,#confirm-emoji{width:64px;height:64px;border-radius:20px;margin:0 auto 16px !important;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);border:1px solid var(--border)}
#modal h3,#confirm-title{font-family:var(--font-display)}

@media (max-width:760px){
  .u-tr.head{display:none}
  .u-tr{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;align-items:start}
  .u-tr > :first-child{grid-column:1/-1}
  .u-tr .lbl{display:block;font-size:11px;color:var(--dim);margin-bottom:3px}
  #admin-list .u-tr:first-child{border-top:none}
  .u-stats.four{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:380px){
  .u-h1{font-size:24px}
  
}

/* Con el botón de descarga el login necesita más compactación en pantallas bajas */
@media (max-width:999px) and (max-height:760px){
  .dl-app{padding:7px 14px;margin-top:7px;font-size:12.5px}
  .dl-app .dl-plat{display:none}
  .auth-card{padding:9px}
  .btn-google,.btn-mail{padding:9px}
  .btn-mail{margin-top:8px}
  .switch-line{margin-top:5px}
  .dev-logo img{height:16px}
}

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script>
const LOGO = "./paga-raton-logo.jpeg";
// Solo para mostrar u ocultar el botón del panel: la autorización real la
// hace el servidor en /api/admin/users comparando el email del token.
const ADMIN_EMAIL = "infinitysolutions.arg@gmail.com";
const S = {
  screen:"loading", user:null, rooms:[], room:null, myId:null, shareUrl:"",
  loadingId:null, animTotal:0, polling:null, pendingMarkId:null, mpStatus:null,
  authReady:false, menuOpen:false, names:[], mpConnecting:false,
  authTab:"login", authEmail:"", remember:true, authError:"", authBusy:false,
  adminUsers:null, adminUsersLoading:false, adminUsersError:"", adminSearch:"",
};

const urlParams   = new URLSearchParams(location.search);
const roomParam   = urlParams.get("room");
const mpConnected = urlParams.get("mp_connected");

async function initFirebase(){
  try{
    const cfg = await fetch("/api/config").then(r=>r.json());
    if(!cfg.apiKey){ S.authReady=true; startApp(); return; }
    firebase.initializeApp(cfg);
    applyPersistence(); // dejarla lista de entrada, para no esperarla en el clic

    // Al volver de un login por redirección (el que usa el celular) acá
    // aparece el error, si Google lo rechazó.
    firebase.auth().getRedirectResult().catch(e=>{
      if(e && e.code) S.authError = authErrMsg(e.code);
    });

    firebase.auth().onAuthStateChanged(async user=>{
      const entroRecien = !S.user && !!user;
      S.user = user;
      if(user) await loadAdminData();
      if(!S.authReady){ S.authReady=true; startApp(); return; }
      // Si acaba de autenticarse y seguía parado en el login, lo llevamos
      // al inicio. Antes esto lo hacía cada función de login por su cuenta.
      if(entroRecien && S.screen==="login"){ closeEmailModal(); S.screen="home"; }
      S.authBusy=false;
      render();
    });
  }catch{ S.authReady=true; startApp(); }
}
function startApp(){
  if(roomParam){ S.screen="join"; }
  else if(!S.user && firebase.apps?.length){ S.screen="login"; }
  else { if(mpConnected) history.replaceState({},"","/"); S.screen="home"; }
  render();
}

async function getToken(){ return S.user ? S.user.getIdToken() : ""; }
async function authFetch(url,opts={}){
  const token = await getToken();
  return fetch(url,{...opts,headers:{"Content-Type":"application/json",...(token?{Authorization:`Bearer ${token}`}:{}),...opts.headers}});
}
async function signInGoogle(){
  setAuthErr("");
  const provider = new firebase.auth.GoogleAuthProvider();

  // Popup en todos lados, también en el celular.
  //
  // La alternativa (signInWithRedirect) parece más robusta para móvil, pero acá
  // NO sirve: el intercambio pasa por <proyecto>.firebaseapp.com, que es otro
  // dominio, y los navegadores móviles particionan ese almacenamiento de
  // terceros, así que la credencial vuelve de Google y no puede entrar. El
  // popup no tiene ese problema porque le habla a la ventana que lo abrió.
  //
  // (Servir el manejador desde nuestro dominio arregla la redirección, pero
  //  exige registrar el URI en el cliente OAuth de Google — ver el proxy de
  //  /__/auth en server.js y la variable AUTH_HANDLER_PROPIO.)
  setAuthBusy(true,"Esperando a Google…");

  // ⚠️  Esta línea tiene que ser la PRIMERA operación asincrónica del clic.
  //     No meter ningún await por delante (ver applyPersistence).
  const entrada = firebase.auth().signInWithPopup(provider);

  try{
    await entrada;
    setAuthInfo("Entrando…"); // onAuthStateChanged termina el viaje
  }catch(e){
    const sinPopup = e.code==="auth/popup-blocked"
      || e.code==="auth/operation-not-supported-in-this-environment";
    setAuthBusy(false);
    if(sinPopup && !isMobileLayout()){
      // En escritorio la redirección sí funciona como respaldo.
      try{ await firebase.auth().signInWithRedirect(provider); return; }catch{}
    }
    if(sinPopup){
      setAuthErr("Tu navegador bloqueó la ventana de Google. Permití las ventanas emergentes para este sitio, o entrá con tu email.");
      return;
    }
    setAuthErr(authErrMsg(e.code));
  }
}
async function signInEmail(isSignup){
  setAuthErr("");
  syncRemember();
  await applyPersistence(); // acá el await no molesta: no se abre ninguna ventana
  const email=document.getElementById("inp-email")?.value.trim();
  const pass=document.getElementById("inp-pass")?.value;
  if(!email||!pass) return setAuthErr("Completá email y contraseña");
  setAuthBusy(true, isSignup?"Creando tu cuenta…":"Entrando…");
  try{
    if(isSignup) await firebase.auth().createUserWithEmailAndPassword(email,pass);
    else         await firebase.auth().signInWithEmailAndPassword(email,pass);
    // De acá en adelante sigue onAuthStateChanged: carga las salas y navega.
  }catch(e){ setAuthBusy(false); setAuthErr(authErrMsg(e.code)); }
}
function signOut(){
  firebase.auth().signOut();
  S.user=null;S.room=null;S.myId=null;S.rooms=[];S.mpStatus=null;S.menuOpen=false;
  S.screen="login"; stopPolling(); render();
}
function authErrMsg(code){
  const m={"auth/user-not-found":"No existe una cuenta con ese email","auth/wrong-password":"Contraseña incorrecta",
    "auth/invalid-credential":"Email o contraseña incorrectos","auth/email-already-in-use":"Ya existe una cuenta con ese email",
    "auth/weak-password":"La contraseña debe tener al menos 6 caracteres","auth/invalid-email":"Email inválido",
    "auth/popup-closed-by-user":"","auth/cancelled-popup-request":"","auth/user-cancelled":"",
    "auth/popup-blocked":"Tu navegador bloqueó la ventana de Google. Probá de nuevo.",
    "auth/network-request-failed":"Sin conexión. Revisá internet y probá de nuevo.",
    "auth/too-many-requests":"Demasiados intentos. Esperá un momento.",
    "auth/unauthorized-domain":"Este dominio no está autorizado en Firebase.",
    "auth/account-exists-with-different-credential":"Ya existe una cuenta con ese email, entrá con el otro método."};
  // Ojo: algunos códigos mapean a cadena vacía a propósito (cerrar el popup
  // no es un error que haya que mostrar), así que no se puede usar ||.
  return code in m ? m[code] : "Ocurrió un error. Intentá de nuevo.";
}
// El renglón de mensajes existe en dos lugares distintos (en línea en
// escritorio, dentro del modal en celular). Escribimos en todos los que haya:
// antes se buscaba un id único y en celular no existía, así que los errores
// del login con Google se perdían y el botón parecía no hacer nada.
function authMsgEls(){ return Array.from(document.querySelectorAll(".auth-msg")); }
function setAuthErr(msg){ authMsgEls().forEach(el=>{ el.style.color=""; el.textContent=msg; }); }
function setAuthOk(msg){ authMsgEls().forEach(el=>{ el.style.color="var(--green)"; el.textContent=msg; }); }
function setAuthInfo(msg){ authMsgEls().forEach(el=>{ el.style.color="var(--accent)"; el.textContent=msg; }); }

// Deja los botones fuera de servicio y avisa que está trabajando, para que no
// parezca colgado mientras el servidor responde.
function setAuthBusy(on,texto){
  S.authBusy=!!on;
  document.querySelectorAll(".btn-google,.btn-mail,.btn-cta").forEach(b=>{ b.disabled=!!on; });
  if(on) setAuthInfo(texto||"Conectando…"); else setAuthErr("");
}

// Si dos flujos la piden a la vez (onAuthStateChanged y el botón de login),
// comparten la misma petición en lugar de duplicar la ida al servidor.
let adminDataEnCurso=null;
async function loadAdminData(){
  if(adminDataEnCurso) return adminDataEnCurso;
  adminDataEnCurso=(async()=>{
  try{
    const [roomsRes,mpRes]=await Promise.all([authFetch("/api/rooms"),authFetch("/api/mp-oauth/status")]);
    if(roomsRes.ok) S.rooms=await roomsRes.json();
    if(mpRes.ok)    S.mpStatus=await mpRes.json();
  }catch{}
  })();
  try{ return await adminDataEnCurso; } finally { adminDataEnCurso=null; }
}

async function connectMercadoPago(){
  try{
    const res=await authFetch("/api/mp-oauth/url"); const data=await res.json();
    if(data.url) window.location.href=data.url;
    else alert(data.error||"No se pudo obtener el link de Mercado Pago");
  }catch{ alert("Error al conectar con Mercado Pago."); }
}
async function disconnectMP(){ try{ await authFetch("/api/mp-oauth/disconnect",{method:"POST"}); }catch{} S.mpStatus={connected:false}; render(); }

function polar(cx,cy,r,deg){const a=(deg-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function slicePath(cx,cy,r,ri,s,e){
  const g=1.5;s+=g;e-=g;
  const[x1,y1]=polar(cx,cy,r,s),[x2,y2]=polar(cx,cy,r,e);
  const[ix1,iy1]=polar(cx,cy,ri,s),[ix2,iy2]=polar(cx,cy,ri,e);
  const la=e-s>180?1:0;
  return`M${ix1} ${iy1}L${x1} ${y1}A${r} ${r} 0 ${la} 1 ${x2} ${y2}L${ix2} ${iy2}A${ri} ${ri} 0 ${la} 0 ${ix1} ${iy1}Z`;
}
function buildWheel(participants,myId,isAdmin){
  const cx=155,cy=155,r=140,ri=78,n=participants.length,step=360/n;
  let svg=`<svg viewBox="0 0 310 310" role="img" aria-label="Estado de los pagos"><defs>
    <linearGradient id="wPaid" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5BE38E"/><stop offset="1" stop-color="#00C982"/></linearGradient>
    <linearGradient id="wDue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A80"/><stop offset="1" stop-color="#E53E3E"/></linearGradient>
    <filter id="gp" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
  participants.forEach((p,i)=>{
    const sa=i*step,ea=sa+step,ma=sa+step/2;
    const[lx,ly]=polar(cx,cy,(r+ri)/2,ma);
    const isMe=p.id===myId,busy=S.loadingId===p.id;
    const fill=p.paid?"url(#wPaid)":busy?"#60606C":"url(#wDue)";
    const canTap=(isMe||isAdmin)&&!p.paid&&!S.loadingId;
    const nombre=esc(p.name.length>8?p.name.slice(0,7)+"…":p.name);
    svg+=`<g ${canTap?`onclick="doPay('${esc(p.id)}','${isAdmin}')"`:""} style="cursor:${canTap?"pointer":"default"}">`;
    if(isMe&&!p.paid)svg+=`<path d="${slicePath(cx,cy,r+8,ri-6,sa,ea)}" fill="#FFB547" opacity="0.25"/>`;
    svg+=`<path d="${slicePath(cx,cy,r,ri,sa,ea)}" fill="${fill}" ${p.paid?'filter="url(#gp)"':""} opacity="${p.paid?1:.92}" style="transition:fill .5s"/>`;
    if(step>26)svg+=`<text x="${lx}" y="${ly-(step>50?7:0)}" text-anchor="middle" dominant-baseline="central" fill="#fff" font-family="Inter,sans-serif" font-size="${step>60?12.5:step>40?11:9.5}" font-weight="700" style="pointer-events:none">${nombre}</text>`;
    if(step>50)svg+=`<text x="${lx}" y="${ly+9}" text-anchor="middle" dominant-baseline="central" fill="rgba(255,255,255,.75)" font-family="Inter,sans-serif" font-size="9.5" style="pointer-events:none">${p.paid?"✓ pagó":busy?"…":isMe?"tocame":"debe"}</text>`;
    svg+=`</g>`;
  });
  svg+=`<circle cx="${cx}" cy="${cy}" r="${ri-3}" fill="#14141A" stroke="rgba(255,255,255,.07)" stroke-width="1"/></svg>`;
  return svg;
}

function mpLogo(sz,onBlue){return `<img src="${onBlue?'./mp-logo-badge.png':'./mp-logo.png'}" alt="MP" style="height:${sz}px;width:auto;display:block;flex-shrink:0"/>`;}

function render(){
  const app=document.getElementById("app");
  app.dataset.screen=S.screen;
  if(S.screen==="login")     return app.innerHTML=renderLogin();
  if(S.screen==="home")      return app.innerHTML=renderHome();
  if(S.screen==="setup")     { app.innerHTML=renderSetup(); return; }
  if(S.screen==="mis-salas") return app.innerHTML=renderMisSalas();
  if(S.screen==="created")   return app.innerHTML=renderCreated();
  if(S.screen==="join")      return renderJoin(app);
  if(S.screen==="adminRoom") return app.innerHTML=renderRoom(true),tickTotal();
  if(S.screen==="room")      return app.innerHTML=renderRoom(false),tickTotal();
  if(S.screen==="admin")     return renderAdminUsers(app);
}
function tickTotal(){
  if(!S.room)return;
  const amount=Math.round(S.room.total/S.room.participants.length);
  const paidCount=S.room.participants.filter(p=>p.paid).length;
  animateTotal(S.animTotal, paidCount*amount);
}

const ICON_AT   = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M16 8v5.5a2.8 2.8 0 0 0 5.6 0V12a9.6 9.6 0 1 0-3.8 7.7"/></svg>`;

const ICON_CHECK = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>`;
const ICON_MAIL = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></svg>`;

const GOOGLE_SVG = `<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>`;

// En el celular el formulario de email vive en un modal, para que la portada
// entre completa. En escritorio va en línea, dentro de la columna derecha.
const MOBILE_Q = window.matchMedia("(max-width:999px)");
function isMobileLayout(){ return MOBILE_Q.matches; }

// Campos de email y contraseña. Los mismos ids en los dos contextos: nunca se
// dibujan los dos a la vez, así que no hay ids duplicados.

function switchLineHTML(isSignup, enModal){

  return `<p class="switch-line">${isSignup
    ? `¿Ya tenés cuenta? <button onclick="${ir}">Ingresá acá</button>`
    : `¿Todavía no tenés cuenta? <button onclick="${ir}">Creá una gratis</button>`}</p>`;

// Restaura el email tipeado y engancha los listeners de los campos.
function wireAuthFields(){
  const e=document.getElementById("inp-email");
  if(e){ e.value=S.authEmail||""; e.oninput=()=>{ S.authEmail=e.value; }; }
  const r=document.getElementById("inp-remember");
  if(r){ r.onchange=()=>{ S.remember=r.checked; applyPersistence(); }; }
}

function renderLogin(){
  const isSignup = S.authTab === "signup";
  const movil = isMobileLayout();
  setTimeout(()=>{
    if(!movil) wireAuthFields();
    // Un error traído desde la redirección de Google se muestra recién ahora,
    // cuando ya existe el renglón donde escribirlo.
    if(S.authError){ setAuthErr(S.authError); S.authError=""; }
  },0);
  return `
    <div class="login-split">
      <section class="login-art">
        <div class="hero">
          <img src="${LOGO}" alt="Pagá Ratón"/>
          <div class="hero-fade"></div>
          <div class="hero-pill"><span class="hero-dot"></span>Directo a Mercado Pago</div>
        </div>
      </section>

      <section class="login-form">
        <div class="welcome">
          <h2 class="welcome-title">Bienvenido a Pagá Ratón</h2>
          <p class="welcome-sub">La mejor app para dividir el asado o la cancha y que todos vean quién es el ratón que no quiere pagar.</p>
        </div>
        <div class="auth-card">
          ${movil ? "" : `<div class="seg">
            <button class="${isSignup?"":"on"}" onclick="setAuthTab('login')">Ingresar</button>
            <button class="${isSignup?"on":""}" onclick="setAuthTab('signup')">Crear cuenta</button>
          </div>`}
          <button class="btn-google" onclick="signInGoogle()">
            ${GOOGLE_SVG}
            ${isSignup?"Registrarme con Google":"Continuar con Google"}
          </button>
          ${movil ? `
          <button class="btn-ghost btn-mail" onclick="openEmailModal(${isSignup})">
            ${ICON_MAIL}
            ${isSignup?"Registrarme con correo electrónico":"Ingresar con correo electrónico"}
          </button>
          <p class="err auth-msg" style="margin-top:10px"></p>` : `

// ── Modal de email (celular) ──────────────────────────────────────────────
function openEmailModal(isSignup){
  S.authTab = isSignup ? "signup" : "login";
  document.getElementById("email-title").textContent = isSignup ? "Creá tu cuenta" : "Ingresar con tu email";
  document.getElementById("email-body").innerHTML = authFieldsHTML(isSignup) + switchLineHTML(isSignup, true);
  document.getElementById("email-modal").classList.add("show");
  wireAuthFields();
  setTimeout(()=>{ document.getElementById("inp-email")?.focus(); },150);
}
function closeEmailModal(){
  const e=document.getElementById("inp-email");
  if(e) S.authEmail=e.value;
  document.getElementById("email-modal").classList.remove("show");
  document.getElementById("email-body").innerHTML="";
}

// Alterna entre "Ingresar" y "Crear cuenta" sin mostrar los dos formularios juntos.
function setAuthTab(tab){
  const e=document.getElementById("inp-email");
  if(e) S.authEmail=e.value;
  const r=document.getElementById("inp-remember");
  if(r) S.remember=r.checked;
  S.authTab=tab;
  render();
}
// Ojito para ver la contraseña que se está tipeando.
function togglePass(){
  const i=document.getElementById("inp-pass"), b=document.getElementById("btn-eye");
  if(!i||!b) return;
  const ver = i.type==="password";
  i.type = ver ? "text" : "password";
  b.innerHTML = ver ? ICON_EYE_OFF : ICON_EYE;
  b.setAttribute("aria-label", ver ? "Ocultar contraseña" : "Mostrar contraseña");
}
// "Recordar mi sesión": con el tilde la sesión sobrevive al cierre del
// navegador; sin el tilde se corta al cerrar la pestaña.
//
// ⚠️  Se aplica al arrancar y cada vez que se toca el tilde — NUNCA justo antes
//     de abrir el popup de Google. setPersistence es asincrónico, y esperarlo
//     dentro del clic consume el gesto del usuario: el navegador deja de
//     considerar que la ventana la pidió una persona y la bloquea. En el
//     celular eso es tajante; en escritorio pasa desapercibido.
function syncRemember(){
  const chk=document.getElementById("inp-remember");
  if(chk) S.remember=chk.checked;
}
function applyPersistence(){
  try{
    return firebase.auth().setPersistence(S.remember
      ? firebase.auth.Auth.Persistence.LOCAL
      : firebase.auth.Auth.Persistence.SESSION);
  }catch(e){ return Promise.resolve(); } // si no lo soporta, queda la de por defecto
}
// Recuperación de clave: Firebase manda el mail con el link para restablecerla.
async function resetPassword(){
  const email=document.getElementById("inp-email")?.value.trim();
  if(!email) return setAuthErr("Escribí tu email arriba y volvé a tocar acá");
  try{
    await firebase.auth().sendPasswordResetEmail(email);
    setAuthOk(`Te mandamos un mail a ${email} para crear una clave nueva`);
  }catch(e){ setAuthErr(authErrMsg(e.code)); }
}

function ic(name,size=18,w=2){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[name]}</svg>`;
}
// Todo texto que venga de un usuario (nombres, títulos, emails) pasa por acá
// antes de entrar al HTML: sin esto, un nombre con etiquetas ejecutaría código
// en la pantalla de quien lo mire — incluido el panel admin.
function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function money(n){ return "$"+Math.round(n||0).toLocaleString("es-AR"); }
function initials(s){
  return String(s||"?").split(/[\s@._-]+/).filter(Boolean).map(w=>w[0]).join("").slice(0,2).toUpperCase()||"?";
}
const AV_COLORS=[["#FFB547","#FF6B18"],["#8EC5F0","#3D7CC9"],["#5BE38E","#00C982"],["#F9A8D4","#DB2777"],["#C4B5FD","#7C3AED"],["#FDE68A","#F59E0B"]];
function avStyle(s){
  let h=0; for(const c of String(s)) h=(h*31+c.charCodeAt(0))>>>0;
  const [a,b]=AV_COLORS[h%AV_COLORS.length];
  return `background:linear-gradient(135deg,${a},${b})`;
}
function avatarHTML(name,photo){
  return `<div class="u-av" style="${avStyle(name)}">${photo?`<img src="${esc(photo)}" alt="" referrerpolicy="no-referrer"/>`:esc(initials(name))}</div>`;
}
function roomStats(r){
  const n=r.participants.length, paid=r.participants.filter(p=>p.paid).length, amount=Math.round(r.total/n);
  return { n, paid, amount, allPaid:paid===n, collected:paid*amount, pending:(n-paid)*amount, pct:Math.round(paid/n*100) };
}
function firstName(){
  const d=(S.user?.displayName||"").trim();
  if(d) return d.split(/\s+/)[0];
  const local=(S.user?.email||"").split("@")[0].split(/[._-]/)[0];
  return local ? local[0].toUpperCase()+local.slice(1) : "";
}
function saludo(){ const h=new Date().getHours(); return h<12?"Buen día":h<20?"Buenas tardes":"Buenas noches"; }

function avatarMenuHTML(){

// Barra superior de todas las pantallas. o.back: código a ejecutar al volver;
// o.title: título en lugar de la marca; o.right: contenido derecho (por

function topbarHTML(o={}){
  const izq=o.back?`<button class="u-icon-btn" onclick="${o.back}" aria-label="Volver">${ic("back",20)}</button>`:"";
  const centro=o.title?`<p class="u-top-title">${esc(o.title)}</p>`:`<div class="u-brand"><img src="${LOGO}" alt=""/><span>Pagá Ratón</span></div>`;

function roomCardHTML(r){

    <div class="u-room-side"><span class="u-chip ${s.allPaid?"closed":"open"}">${s.allPaid?"Cerrada":"Abierta"}</span>${s.allPaid?"":`<button class="u-del" title="Eliminar sala" aria-label="Eliminar sala" onclick="event.stopPropagation();askDeleteRoomById('${esc(r.id)}')">${ic("trash",15)}</button>`}</div>

      <div style="flex:1"><p style="font-weight:700;font-size:15px">Panel admin</p><p class="sub" style="font-size:12.5px">Usuarios registrados en la app</p></div>

function renderSetup(){
  const connected=S.mpStatus?.connected, nickname=S.mpStatus?.nickname||"";
  setTimeout(()=>{
    const t=document.getElementById("inp-title"), to=document.getElementById("inp-total"), n=document.getElementById("inp-name");
    if(t){ t.value=S.draftTitle||""; t.oninput=()=>{ S.draftTitle=t.value; updateSetupBtn(); }; }
    if(to){ to.value=S.draftTotal||""; to.oninput=()=>{ S.draftTotal=to.value; updateSetupBtn(); }; }
    if(n){ n.oninput=updateAddBtn; n.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); addName(); } }; }
    updateSetupBtn();
  },0);
  return `
    ${topbarHTML({back:"S.screen='home';render()"})}
    <div style="margin-top:6px"><p class="u-kicker">Nuevo gasto compartido</p><h1 class="u-h1" style="margin-top:6px">Armá la sala</h1></div>

    <div class="u-card" style="margin-top:18px">
      <div class="u-step"><span class="u-step-n ${connected?"ok":""}">${connected?ic("check",13,3):"1"}</span><p class="u-h2" style="font-size:15px">¿Dónde cobrás?</p></div>
      ${connected
        ? `<div class="row"><div style="display:flex;align-items:center;gap:12px;min-width:0">${mpLogo(26)}<div style="min-width:0"><p style="margin:0;font-weight:700;font-size:14px">Mercado Pago conectado</p><p class="sub" style="margin:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(nickname)}</p></div></div><button class="u-btn sm" onclick="disconnectMP()">Desconectar</button></div>`
        : `<button class="u-btn mp block" onclick="connectMercadoPago()">${mpLogo(20,true)} Conectar Mercado Pago</button><p class="muted" style="margin-top:10px;text-align:center">Los pagos de tus invitados van directo a tu cuenta.</p>`}
    </div>

    <div class="u-card">
      <div class="u-step"><span class="u-step-n">2</span><p class="u-h2" style="font-size:15px">¿Qué dividen?</p></div>
      <input id="inp-title" placeholder="Ej: Cancha del jueves" maxlength="60" autocomplete="off"/>
      <div class="u-quick">${["⚽ Cancha","🥩 Asado","🍕 Cena","✈️ Viaje","🎁 Regalo","🎂 Cumple"].map(q=>`<button onclick="quickTitle('${q}')">${q}</button>`).join("")}</div>
    </div>

    <div class="u-card">
      <div class="u-step"><span class="u-step-n">3</span><p class="u-h2" style="font-size:15px">¿Cuánto salió en total?</p></div>
      <div class="u-money"><span>$</span><input id="inp-total" type="number" inputmode="numeric" min="1" placeholder="0"/></div>
      <p id="amount-hint" class="sub" style="margin-top:10px;font-size:13px"></p>
    </div>

    <div class="u-card">
      <div class="u-step"><span class="u-step-n">4</span><p class="u-h2" style="font-size:15px">¿Quiénes participan?</p><span id="people-count" class="u-chip info plain" style="margin-left:auto">${S.names.length}</span></div>
      <div class="u-add"><input id="inp-name" placeholder="Nombre" maxlength="30" autocomplete="off"/><button id="btn-add" onclick="addName()" disabled aria-label="Agregar">+</button></div>
      <div id="names-list" class="u-people">${namesHTML()}</div>
    </div>

    <div class="u-sticky">
      <div class="info"><p id="setup-summary" style="font-weight:700;font-size:14px">Completá los datos</p><p id="setup-sub" class="muted" style="margin-top:1px">Mínimo 2 personas</p></div>
      <button class="u-btn primary" onclick="createRoom()" id="btn-create" disabled>Crear sala</button>
    </div>`;

function quickTitle(q){ const t=document.getElementById("inp-title"); if(!t) return; t.value=q; S.draftTitle=q; updateSetupBtn(); t.focus(); }
function namesHTML(){
  if(!S.names.length) return `<p class="muted" style="margin:2px 0 0">Agregá al menos 2 personas (vos incluido si ponés plata).</p>`;
  return S.names.map((n,i)=>`<span class="u-person"><span class="a" style="${avStyle(n)}">${esc(initials(n))}</span>${esc(n)}<button onclick="removeNameAt(${i})" aria-label="Quitar a ${esc(n)}">×</button></span>`).join("");
}
function renderNamesList(){
  const el=document.getElementById("names-list"); if(el) el.innerHTML=namesHTML();
  const c=document.getElementById("people-count"); if(c) c.textContent=S.names.length;
}
function updateAddBtn(){ const v=document.getElementById("inp-name")?.value.trim(); const b=document.getElementById("btn-add"); if(b) b.disabled=!v; }
function updateSetupBtn(){
  const t=document.getElementById("inp-title")?.value.trim();
  const tot=parseInt(document.getElementById("inp-total")?.value||"0",10);
  const n=S.names.length, mp=S.mpStatus?.connected, ok=!!t&&tot>0&&n>=2&&mp;
  const b=document.getElementById("btn-create"); if(b) b.disabled=!ok;
  const per=n>=2&&tot>0?money(tot/n):null;
  const sum=document.getElementById("setup-summary"), sub=document.getElementById("setup-sub");
  if(sum) sum.textContent = per && mp && t ? `${per} cada uno` : !mp?"Conectá Mercado Pago":!t?"Poné un nombre":!tot?"Falta el total":"Faltan personas";
  if(sub) sub.textContent = per ? `${n} personas · total ${money(tot)}` : `${n}/2 personas como mínimo`;
  const hint=document.getElementById("amount-hint");
  if(hint) hint.innerHTML = per ? `Cada uno paga <b class="accent">${per}</b>` : "";
}
function addName(){
  const inp=document.getElementById("inp-name"); const n=inp.value.trim();
  if(!n||S.names.includes(n)) return;
  S.names.push(n); inp.value=""; inp.focus(); updateAddBtn(); renderNamesList(); updateSetupBtn();
}
function removeNameAt(i){ S.names.splice(i,1); renderNamesList(); updateSetupBtn(); }
function removeName(name){ S.names=S.names.filter(x=>x!==name); renderNamesList(); updateSetupBtn(); }
async function createRoom(){
  const title=document.getElementById("inp-title")?.value.trim();
  const total=parseInt(document.getElementById("inp-total")?.value,10);
  if(!title||!total||S.names.length<2) return;
  const b=document.getElementById("btn-create"); b.disabled=true; b.textContent="Creando…";
  try{
    const res=await authFetch("/api/rooms",{method:"POST",body:JSON.stringify({title,total,participants:S.names})});
    if(res.status===401){ alert("Sesión expirada. Volvé a ingresar."); S.screen="login"; render(); return; }
    const data=await res.json();
    // Antes cualquier error del servidor (por ejemplo, sin Mercado Pago
    // conectado) se tomaba como si fuera la sala creada.
    if(!res.ok){ alert(data.error||"No se pudo crear la sala."); b.textContent="Crear sala"; updateSetupBtn(); return; }
    S.room=data; S.shareUrl=data.shareUrl||`${location.origin}/?room=${data.id}`;
    S.rooms=[data,...S.rooms]; S.names=[]; S.draftTitle=""; S.draftTotal="";
    S.screen="created"; render();
  }catch{ alert("Error al crear la sala."); b.textContent="Crear sala"; updateSetupBtn(); }
}

function renderMisSalas(){
  const f=S.roomsFilter||"todas";
  const cerrada=r=>roomStats(r).allPaid;
  const lista=S.rooms.filter(r=>f==="todas"||(f==="abiertas"?!cerrada(r):cerrada(r)));
  const nA=S.rooms.filter(r=>!cerrada(r)).length, nC=S.rooms.length-nA;
  return `
    ${topbarHTML({back:"S.screen='home';render()"})}
    <div style="margin-top:6px"><h1 class="u-h1">Mis salas</h1><p class="sub" style="margin-top:4px">${S.rooms.length} sala${S.rooms.length!==1?"s":""} · las cerradas quedan como constancia</p></div>
    ${S.rooms.length?`<div class="u-seg" style="margin:18px 0 14px">${[["todas",`Todas · ${S.rooms.length}`],["abiertas",`Abiertas · ${nA}`],["cerradas",`Cerradas · ${nC}`]].map(([k,t])=>`<button class="${f===k?"on":""}" onclick="S.roomsFilter='${k}';render()">${t}</button>`).join("")}</div>`:""}

function leaveRoom(){stopPolling();S.myId=null;S.loadingId=null;S.animTotal=0;if(roomParam)location.href="/";else S.screen="home";render();}

function askMarkPaid(id,name){S.pendingMarkId=id;document.getElementById("modal-name").textContent=name;document.getElementById("modal").classList.add("show");}
function closeModal(){document.getElementById("modal").classList.remove("show");S.pendingMarkId=null;}
async function confirmMarkPaid(){
  const id=S.pendingMarkId;closeModal();if(!id)return;
  S.loadingId=id;render();
  try{const res=await authFetch(`/api/rooms/${S.room.id}/mark-paid/${id}`,{method:"POST"});if(res.ok){S.room=await res.json();S.rooms=S.rooms.map(r=>r.id===S.room.id?S.room:r);}}
  catch{alert("Error al marcar como pagado.");}
  S.loadingId=null;render();
}
async function doPay(participantId,isAdminStr){
  if(S.loadingId)return;
  if(isAdminStr==="true"){const p=S.room.participants.find(x=>x.id===participantId);askMarkPaid(participantId,p?.name||"");return;}
  S.loadingId=participantId;render();
  try{const res=await fetch(`/api/rooms/${S.room.id}/pay/${participantId}`,{method:"POST",headers:{"Content-Type":"application/json"}});const data=await res.json();if(data.init_point)window.open(data.init_point,"_blank");else alert(data.error||"No se pudo generar el link de pago.");}
  catch{alert("Error al generar el link de pago.");}
  S.loadingId=null;render();
}
function startPolling(){
  stopPolling();
  S.polling=setInterval(async()=>{
    if(!S.room)return;
    try{const res=await fetch(`/api/rooms/${S.room.id}`);if(!res.ok)return;const updated=await res.json();
      const prev=JSON.stringify(S.room.participants.map(p=>p.paid)),next=JSON.stringify(updated.participants.map(p=>p.paid));
      if(prev!==next){S.room=updated;S.rooms=S.rooms.map(r=>r.id===updated.id?updated:r);render();}}catch{}
  },3000);
}
function stopPolling(){if(S.polling){clearInterval(S.polling);S.polling=null;}}

let animFrame;
function animateTotal(from,to){
  if(animFrame)cancelAnimationFrame(animFrame);
  if(from===to){S.animTotal=to;return;}
  const t0=performance.now(),dur=600;
  function tick(now){const p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,3);S.animTotal=Math.round(from+(to-from)*e);const el=document.getElementById("anim-total");if(el)el.textContent="$"+S.animTotal.toLocaleString("es-AR");if(p<1)animFrame=requestAnimationFrame(tick);else S.animTotal=to;}
  animFrame=requestAnimationFrame(tick);
}

let confirmAction=null;
function askConfirm(o){
  confirmAction=o.action||null;
  document.getElementById("confirm-emoji").textContent=o.emoji||"❓";
  document.getElementById("confirm-title").textContent=o.title||"";
  document.getElementById("confirm-text").innerHTML=o.text||"";
  const yes=document.getElementById("confirm-yes");
  yes.textContent=o.yes||"Sí";
  yes.classList.toggle("btn-danger",!!o.danger);
  const no=document.getElementById("confirm-no");
  no.textContent=o.no||"Cancelar";
  no.style.display=o.soloOk?"none":"";
  document.getElementById("confirm-modal").classList.add("show");
}
function closeConfirm(){ document.getElementById("confirm-modal").classList.remove("show"); confirmAction=null; }
function runConfirm(){ const a=confirmAction; closeConfirm(); if(a) a(); }

// Cerrar sesión, previa confirmación.
function askSignOut(){
  askConfirm({
    emoji:"🚪", title:"Cerrar sesión", danger:true, yes:"Sí, salir",
    text:"¿Seguro que querés salir? Vas a tener que ingresar de nuevo para ver tus salas.",
    action:signOut,
  });
}

// Borrar una sala. Las cerradas no se pueden borrar: quedan como constancia,
// así que el botón ni siquiera se dibuja. El servidor lo vuelve a chequear.
function askDeleteRoom(id,title){
  askConfirm({
    emoji:"🗑️", title:"Eliminar sala", danger:true, yes:"Sí, eliminar",
    text:`Se va a borrar <strong style="color:var(--text)">${title}</strong> y su link va a dejar de funcionar. Esto no se puede deshacer.`,
    action:()=>deleteRoom(id),
  });
}
async function deleteRoom(id){
  try{
    const res=await authFetch(`/api/rooms/${id}`,{method:"DELETE"});
    if(!res.ok){
      const d=await res.json().catch(()=>({}));
      alert(d.error||"No se pudo eliminar la sala.");
      return;
    }
    S.rooms=S.rooms.filter(r=>r.id!==id);
    if(S.room&&S.room.id===id){ S.room=null; stopPolling(); S.screen="mis-salas"; }
    render();
  }catch{ alert("Error al eliminar la sala."); }
}
