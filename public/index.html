// ═══════════════════════════════════════════════════════════════════════════════
// PANEL ADMIN — lista de todas las personas registradas en la app.
// Solo lo ve quien entró con ADMIN_EMAIL; el servidor lo vuelve a exigir en
// /api/admin/users, así que ocultar el botón acá es comodidad, no seguridad.
// ═══════════════════════════════════════════════════════════════════════════════
function isSuperAdmin(){ return (S.user?.email||"").toLowerCase()===ADMIN_EMAIL && S.user?.emailVerified===true; }

async function renderAdminUsers(app){
  if(!isSuperAdmin()){
    app.innerHTML=`${topbarHTML({back:"S.screen='home';render()"})}<div class="u-empty" style="margin-top:20px"><p style="color:var(--red);margin:0">No tenés permiso para ver esta pantalla.</p></div>`;
    return;
  }
  if(S.adminUsers===null && !S.adminUsersLoading) loadAdminUsers();
  app.innerHTML=adminUsersHTML();
  setTimeout(()=>{
    const s=document.getElementById("admin-search");
    if(s){ s.value=S.adminSearch; s.oninput=()=>{ S.adminSearch=s.value; renderAdminList(); }; }
  },0);
}

async function loadAdminUsers(){
  S.adminUsersLoading=true; S.adminUsersError="";
  render();
  try{
    const res=await authFetch("/api/admin/users");
    if(res.status===403){ S.adminUsersError="No tenés permiso para ver esta lista."; }
    else if(!res.ok){ S.adminUsersError="No se pudo cargar la lista de usuarios."; }
    else{ S.adminUsers=await res.json(); }
  }catch{ S.adminUsersError="Error de conexión al pedir los usuarios."; }
  S.adminUsersLoading=false;
  render();
}

function fmtFecha(iso){
  if(!iso) return "—";
  return new Date(iso).toLocaleDateString("es-AR",{day:"2-digit",month:"short",year:"numeric"});
}
function fmtFechaHora(iso){
  if(!iso) return "Nunca";
  return new Date(iso).toLocaleDateString("es-AR",{day:"2-digit",month:"short",year:"numeric"})
    +" · "+new Date(iso).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
}

function adminUsersHTML(){
  const cargando=S.adminUsersLoading && !S.adminUsers;
  const lista=S.adminUsers||[];
  const stats=[
    ["Usuarios", lista.length, ""],
    ["Con Google", lista.filter(u=>u.provider.includes("Google")).length, ""],
    ["MP conectado", lista.filter(u=>u.mpConnected).length, "green"],
    ["Salas creadas", lista.reduce((n,u)=>n+u.roomsCreated,0), "accent"],
  ];
  return `
    ${topbarHTML({back:"S.screen='home';render()"})}
    <div class="row" style="margin-top:6px;align-items:flex-end;flex-wrap:wrap;gap:14px">
      <div><p class="u-kicker">Administración</p><h1 class="u-h1" style="margin-top:6px">Usuarios registrados</h1></div>
      ${lista.length?`<div style="display:flex;gap:8px"><button class="u-btn sm" onclick="S.adminUsers=null;render()">Actualizar</button><button class="u-btn sm" onclick="exportAdminUsersCSV()">${ic("download",15)} CSV</button></div>`:""}
    </div>
    ${lista.length?`
    <div class="u-stats four" style="margin-top:18px">${stats.map(([t,v,c])=>`<div class="u-stat"><p class="u-kicker">${t}</p><p class="v ${c}">${v}</p></div>`).join("")}</div>
    <div class="field" style="margin:16px 0"><span class="field-icon">${ic("search",17)}</span><input id="admin-search" placeholder="Buscar por nombre o email…"/></div>`:""}
    ${cargando?`<div class="u-empty" style="margin-top:18px"><div class="spinner" style="margin:0 auto 12px"></div><p class="sub" style="margin:0">Cargando usuarios…</p></div>`:""}
    ${S.adminUsersError?`<div class="u-empty" style="margin-top:18px"><p style="color:var(--red);margin:0">${esc(S.adminUsersError)}</p></div>`:""}
    ${!cargando&&!S.adminUsersError?`<div class="u-table">
      <div class="u-tr head"><span>Usuario</span><span>Acceso</span><span>Alta</span><span>Último ingreso</span><span>Salas</span><span>Mercado Pago</span></div>
      <div id="admin-list">${adminListHTML()}</div>
    </div>`:""}`;
}

function adminListHTML(){
  const q=(S.adminSearch||"").trim().toLowerCase();
  const lista=(S.adminUsers||[]).filter(u => !q || u.email.toLowerCase().includes(q) || u.displayName.toLowerCase().includes(q));
  if(!lista.length) return `<div style="padding:28px;text-align:center"><p class="muted" style="margin:0">${q?"Nadie coincide con esa búsqueda.":"Todavía no se registró nadie."}</p></div>`;
  return lista.map(u=>{
    const nombre=u.displayName||u.email||"(sin nombre)";
    const esAdm=u.email.toLowerCase()===ADMIN_EMAIL;
    return `<div class="u-tr">
      <div style="display:flex;align-items:center;gap:12px;min-width:0">${avatarHTML(nombre,u.photoURL)}<div style="min-width:0"><p style="font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(nombre)}${esAdm?` <span class="u-chip info plain" style="padding:2px 8px;margin-left:4px">Admin</span>`:""}</p><p class="sub" style="font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(u.email)}</p></div></div>
      <div><span class="lbl">Acceso</span><span class="u-chip ${u.provider.includes("Google")?"closed":"open"} plain">${esc(u.provider)}</span></div>
      <div><span class="lbl">Alta</span><p style="font-size:13px">${fmtFecha(u.createdAt)}</p></div>
      <div><span class="lbl">Último ingreso</span><p style="font-size:13px">${fmtFechaHora(u.lastSignIn)}</p></div>
      <div><span class="lbl">Salas</span><p style="font-size:13px;font-weight:700">${u.roomsCreated}</p></div>
      <div><span class="lbl">Mercado Pago</span><p class="${u.mpConnected?"green":"muted"}" style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${u.mpConnected?esc(u.mpNickname||"Conectado"):"Sin conectar"}</p></div>
    </div>`;
  }).join("");
}

function renderAdminList(){
  const el=document.getElementById("admin-list");
  if(el) el.innerHTML=adminListHTML();
}

function exportAdminUsersCSV(){
  const lista=S.adminUsers||[];
  if(!lista.length) return;
  const filas=[["Nombre","Email","Proveedor","Alta","Último ingreso","Salas creadas","Mercado Pago"]];
  lista.forEach(u=>filas.push([
    u.displayName, u.email, u.provider, fmtFecha(u.createdAt), fmtFechaHora(u.lastSignIn),
    String(u.roomsCreated), u.mpConnected?(u.mpNickname||"Conectado"):"Sin conectar",
  ]));
  const csv="﻿"+filas.map(f=>f.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`paga-raton-usuarios-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ═══════════════════════════════════════════════════════════════════════════════
// INSTALAR COMO APP (PWA)
// Chrome/Edge/Android avisan con "beforeinstallprompt" que se puede instalar;
// iPhone no tiene ese evento y se instala desde Compartir → Agregar a inicio.
// No se llama a preventDefault: así el navegador sigue mostrando su propia
// barra de instalación (por ejemplo en el login), y además guardamos el evento
// para ofrecer el botón propio en la app.
// ═══════════════════════════════════════════════════════════════════════════════
let installEvent=null;
const ES_APP = matchMedia("(display-mode: standalone)").matches || navigator.standalone===true;
const ES_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
window.addEventListener("beforeinstallprompt",e=>{ installEvent=e; if(S.screen!=="login") render(); });
window.addEventListener("appinstalled",()=>{ installEvent=null; S.appInstalada=true; if(S.screen!=="login") render(); });

function puedeInstalar(){ return !ES_APP && !S.appInstalada && (!!installEvent || ES_IOS); }
function installDescartado(){ try{ return localStorage.getItem("pr-install-no")==="1"; }catch{ return false; } }
function descartarInstall(){ try{ localStorage.setItem("pr-install-no","1"); }catch{} render(); }

async function installApp(){
  S.menuOpen=false;
  // En el login NO se redibuja: se perdería lo que la persona está escribiendo.
  const redibujar=()=>{ if(S.screen!=="login") render(); };
  if(installEvent){
    installEvent.prompt();
    try{ await installEvent.userChoice; }catch{}
    installEvent=null; redibujar();
    return;
  }
  redibujar();
  const b=t=>`<b style="color:var(--text)">${t}</b>`;
  if(ES_IOS){
    askConfirm({ emoji:"📲", title:"Instalá Pagá Ratón", yes:"Entendido", soloOk:true,
      text:`Tocá el botón ${b("Compartir")} del navegador y elegí ${b("Agregar a pantalla de inicio")}. Queda con su ícono, como cualquier app.` });
    return;
  }
  // Navegadores sin aviso de instalación (Firefox, Samsung Internet…) o app
  // ya instalada: se explica cómo hacerlo desde el menú del navegador.
  askConfirm({ emoji:"📲", title:"Instalá Pagá Ratón", yes:"Entendido", soloOk:true,
    text:S.appInstalada
      ? "La app ya quedó instalada: buscala en tu pantalla de inicio o en tus aplicaciones."
      : `Abrí el menú del navegador (${b("⋮")}) y elegí ${b("Instalar aplicación")} o ${b("Agregar a la pantalla de inicio")}. Si no aparece, abrí este sitio desde Chrome.` });
}
function installBannerHTML(){
  if(!puedeInstalar() || installDescartado()) return "";
  return `<div class="u-install">
    <img src="/icon-192.png" alt=""/>
    <div style="flex:1;min-width:0"><p style="margin:0;font-weight:700;font-size:14px">Instalá la app</p><p class="sub" style="margin:2px 0 0;font-size:12.5px">Tenela en tu pantalla de inicio y abrila al toque.</p></div>
    <button class="u-btn primary sm" onclick="installApp()">Instalar</button>
    <button class="u-x" onclick="descartarInstall()" aria-label="Ahora no">×</button>
  </div>`;
}
